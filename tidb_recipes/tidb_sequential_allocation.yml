- name: "tidb_sequential_allocation.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_sequential_allocation"

    api_base_url: "http://localhost:8081"

    infra_payload: "{{ playbook_dir }}/../examples/e2e.json"
    vdev_payload: "{{ playbook_dir }}/../examples/create_vdev_100gb_1replica.json"

    # Maximum number of sequential allocations to attempt.
    allocation_iterations: 10

    # Used internally by the get_chunks lookup.
    chunk_page_limit: 4

  tasks:
    - block:

        # =====================================================
        # 0. Validate application type
        # =====================================================

        - name: "{{ recipe_name }}: Check if app_type is tidb."
          debug:
            msg: "app_type is: {{ app_type }}"
          failed_when: app_type != "tidb"

        # =====================================================
        # 1. Start mdsvc-tidb
        # =====================================================

        - name: "{{ recipe_name }}: Set up mdsvc-tidb backend."
          set_fact:
            setup_status: "{{ lookup('tidb_setup', 'setup') }}"

        - name: "{{ recipe_name }}: Print setup result."
          debug:
            msg: setup_status

        - name: "{{ recipe_name }}: Wait for mdsvc-api to become ready."
          uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code: [200, 301, 302]
          register: api_health
          retries: 90
          delay: 3
          until: api_health.status in [200, 301, 302]

        # =====================================================
        # 2. Login
        # =====================================================

        - name: "{{ recipe_name }}: Login to mdsvc-api."
          set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username='admin',
                  password='admin'
                )
              }}

        - name: "{{ recipe_name }}: Store access token."
          set_fact:
            access_token: "{{ login_result.access_token }}"

        - name: "{{ recipe_name }}: Validate access token."
          debug:
            msg: "Authentication completed successfully."
          failed_when:
            access_token is not defined or
            access_token | length == 0

        # =====================================================
        # 3. Read VDEV configuration
        # =====================================================

        - name: "{{ recipe_name }}: Read VDEV payload."
          set_fact:
            vdev_payload_data: "{{ lookup('file', vdev_payload) | from_json }}"

        - name: "{{ recipe_name }}: Store requested VDEV configuration."
          set_fact:
            requested_vdev_size: >-
              {{
                vdev_payload_data.size_bytes
                | default(vdev_payload_data.size)
                | int
              }}
            expected_replica_count: >-
              {{
                vdev_payload_data.data_blk_cnt
                | default(vdev_payload_data.data_blk_cnt)
                | int
              }}

        - name: "{{ recipe_name }}: Print requested configuration."
          debug:
            msg:
              - "Requested VDEV size: {{ requested_vdev_size }}"
              - "Expected replica count: {{ expected_replica_count }}"
              - "Maximum allocation attempts: {{ allocation_iterations }}"

        - name: "{{ recipe_name }}: Validate requested configuration."
          debug:
            msg: "VDEV configuration is valid."
          failed_when:
            requested_vdev_size | int <= 0 or
            expected_replica_count | int <= 0

        - name: "{{ recipe_name }}: Read infra payload."
          set_fact:
            infra_payload_data: "{{ lookup('file', infra_payload) | from_json }}"

        - name: "{{ recipe_name }}: Compute expected NISD count from infra payload."
          set_fact:
            expected_nisd_count: >-
              {{
                infra_payload_data
                | json_query('pdus[].racks[].hypervisors[].devices[].partitions[].nisd.id')
                | length
              }}

        # =====================================================
        # 4. Create infrastructure
        # =====================================================

        - name: "{{ recipe_name }}: Create infrastructure."
          set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=access_token,
                  file=infra_payload
                )
              }}

        - name: "{{ recipe_name }}: Print infrastructure response."
          debug:
            var: infra_result

        - name: "{{ recipe_name }}: Validate infrastructure response."
          debug:
            msg: "Infrastructure was created successfully."
          failed_when: >
            infra_result.status_code | int not in [200, 201] or
            infra_result.status | int != 0

        # =====================================================
        # 5. Fetch initial NISD state
        # =====================================================

        - name: "{{ recipe_name }}: Fetch initial NISD resources."
          set_fact:
            initial_nisd_result: >-
              {{
                lookup(
                  'tidb_api',
                  'get_resource',
                  base_url=api_base_url,
                  token=access_token,
                  params={
                    'type': 'nisd'
                  }
                )
              }}

        - name: "{{ recipe_name }}: Store initial NISD resources."
          set_fact:
            initial_nisd_resources: >-
              {{
                initial_nisd_result.data.payload.resources
                | default([])
              }}

        - name: "{{ recipe_name }}: Validate NISDs are available."
          debug:
            msg: "Number of NISDs: {{ initial_nisd_resources | length }}"
          failed_when:
            initial_nisd_resources | length == 0

        - name: "{{ recipe_name }}: Validate NISD count matches infra configuration."
          debug:
            msg:
              - "Expected NISDs: {{ expected_nisd_count }}"
              - "Actual NISDs: {{ initial_nisd_resources | length }}"
          failed_when:
            initial_nisd_resources | length != expected_nisd_count | int

        # =====================================================
        # 6. Build NISD failure-domain map
        # =====================================================

        - name: "{{ recipe_name }}: Initialize NISD metadata maps."
          set_fact:
            nisd_rack_map: {}
            initial_nisd_capacity_map: {}

        - name: "{{ recipe_name }}: Build NISD rack map."
          set_fact:
            nisd_rack_map: >-
              {{
                nisd_rack_map
                | combine({
                    item.id | string:
                      item.fd_rack_id | default('')
                  })
              }}
          loop: "{{ initial_nisd_resources }}"
          loop_control:
            label: "{{ item.id }}"

        - name: "{{ recipe_name }}: Build initial NISD capacity map."
          set_fact:
            initial_nisd_capacity_map: >-
              {{
                initial_nisd_capacity_map
                | combine({
                    item.id | string: {
                      'total_size': item.total_size | int,
                      'available_size': item.available_size | int
                    }
                  })
              }}
          loop: "{{ initial_nisd_resources }}"
          loop_control:
            label: "{{ item.id }}"

        # =====================================================
        # 7. Validate initial capacity state
        # =====================================================

        - name: "{{ recipe_name }}: Validate initial NISD capacity."
          vars:
            total_size: "{{ item.total_size | int }}"
            available_size: "{{ item.available_size | int }}"
            used_capacity: >-
              {{
                item.total_size | int -
                item.available_size | int
              }}
          debug:
            msg:
              - "NISD: {{ item.id }}"
              - "Total size: {{ total_size }}"
              - "Available size: {{ available_size }}"
              - "Used capacity: {{ used_capacity }}"
          failed_when:
            total_size | int < 0 or
            available_size | int < 0 or
            available_size | int > total_size | int or
            used_capacity | int > total_size | int
          loop: "{{ initial_nisd_resources }}"
          loop_control:
            label: "{{ item.id }}"

        - name: "{{ recipe_name }}: Compute expected allocation count."
          set_fact:
            expected_allocation_result: >-
              {{
                lookup(
                  'tidb_api', 'expected_allocations',
                  nisd_resources=initial_nisd_resources,
                  replica_count=expected_replica_count,
                  vdev_size=requested_vdev_size
                )
              }}

        - name: "{{ recipe_name }}: Print expected allocation computation."
          debug:
            var: expected_allocation_result

        - name: "{{ recipe_name }}: Clamp expected allocations to the configured iteration limit."
          set_fact:
            expected_allocation_count_clamped: >-
              {{
                [
                  expected_allocation_result.expected_allocations | int,
                  allocation_iterations | int
                ] | min
              }}

        # =====================================================
        # 8. Initialize sequential allocation state
        # =====================================================

        - name: "{{ recipe_name }}: Initialize allocation state."
          set_fact:
            successful_allocations: []
            allocation_exhausted: false
            allocation_failure: {}
            previous_nisd_capacity_map: "{{ initial_nisd_capacity_map }}"

        # =====================================================
        # 9. Sequentially create and validate VDEVs
        # =====================================================

        - name: "{{ recipe_name }}: Get chunk info after unpause compaction."
          include_role:
            name: common
            tasks_from: tidb_sequential_allocation_iteration
          loop: "{{ range(0, allocation_iterations | int) | list }}"
          loop_control:
            loop_var: allocation_index
            label: "allocation={{ allocation_index + 1 }}"

        - name: "{{ recipe_name }}: Fetch chunk mappings for all successful allocations."
          set_fact:
            allocation_chunk_results: >-
              {{
                allocation_chunk_results | default([]) + [{
                  'vdev_id': item.vdev_id,
                  'num_chunks': item.num_chunks,
                  'chunks_result': lookup(
                    'tidb_api', 'get_chunks',
                    base_url=api_base_url,
                    token=access_token,
                    params={'vdev_id': item.vdev_id, 'limit': chunk_page_limit}
                  )
                }]
              }}
          loop: "{{ successful_allocations }}"
          loop_control:
            label: "{{ item.vdev_id }}"

        - name: "{{ recipe_name }}: Validate chunk mapping integrity per VDEV."
          debug:
            msg:
              - "VDEV: {{ item.vdev_id }}"
              - "Expected chunks: {{ item.num_chunks }}"
              - "Fetched chunks: {{ item.chunks_result.chunks | length }}"
          failed_when:
            item.chunks_result.chunks | length != item.num_chunks | int
          loop: "{{ allocation_chunk_results }}"
          loop_control:
            label: "{{ item.vdev_id }}"

        - name: "{{ recipe_name }}: Validate replica count, duplicate targets, and anti-affinity per chunk."
          vars:
            chunk: "{{ item.1 }}"
            replica_domains: "{{ chunk.nisd_ids | map('extract', nisd_rack_map) | list }}"
          debug:
            msg:
              - "VDEV: {{ item.0.vdev_id }}"
              - "Chunk: {{ chunk.chunk_idx }}"
              - "Replica NISDs: {{ chunk.nisd_ids }}"
              - "Replica failure domains: {{ replica_domains }}"
          failed_when:
            chunk.nisd_ids | length != expected_replica_count | int or
            chunk.nisd_ids | unique | length != chunk.nisd_ids | length or
            replica_domains | unique | length != expected_replica_count | int
          loop: "{{ allocation_chunk_results | subelements('chunks_result.chunks') }}"
          loop_control:
            label: "{{ item.0.vdev_id }}:{{ item.1.chunk_idx }}"

        # =====================================================
        # 10. Validate allocation metadata
        # =====================================================

        - name: "{{ recipe_name }}: Print successful allocations."
          debug:
            var: successful_allocations

        - name: "{{ recipe_name }}: Extract allocated VDEV UUIDs."
          set_fact:
            allocated_vdev_ids: >-
              {{
                successful_allocations
                | map(attribute='vdev_id')
                | list
              }}

        - name: "{{ recipe_name }}: Validate allocated VDEV UUID uniqueness."
          debug:
            msg:
              - "Allocated VDEV IDs: {{ allocated_vdev_ids }}"
              - >-
                Successful allocations:
                {{ successful_allocations | length }}
          failed_when:
            (allocated_vdev_ids | unique | length) != (allocated_vdev_ids | length)

        - name: "{{ recipe_name }}: Validate expected allocation count reached."
          debug:
            msg:
              - "Expected allocations: {{ expected_allocation_count_clamped }}"
              - "Actual allocations: {{ successful_allocations | length }}"
          failed_when:
            successful_allocations | length != expected_allocation_count_clamped | int

        # =====================================================
        # 11. Fetch final NISD capacity state
        # =====================================================

        - name: "{{ recipe_name }}: Fetch final NISD resources."
          set_fact:
            final_nisd_result: >-
              {{
                lookup(
                  'tidb_api',
                  'get_resource',
                  base_url=api_base_url,
                  token=access_token,
                  params={
                    'type': 'nisd'
                  }
                )
              }}

        - name: "{{ recipe_name }}: Store final NISD resources."
          set_fact:
            final_nisd_resources: >-
              {{
                final_nisd_result.data.payload.resources
                | default([])
              }}

        # =====================================================
        # 12. Validate final capacity safety
        # =====================================================

        - name: "{{ recipe_name }}: Validate final NISD capacity."
          vars:
            total_size: "{{ item.total_size | int }}"
            available_size: "{{ item.available_size | int }}"
            used_capacity: >-
              {{
                item.total_size | int -
                item.available_size | int
              }}
          debug:
            msg:
              - "NISD: {{ item.id }}"
              - "Total size: {{ total_size }}"
              - "Available size: {{ available_size }}"
              - "Used capacity: {{ used_capacity }}"
          failed_when:
            total_size | int < 0 or
            available_size | int < 0 or
            available_size | int > total_size | int or
            used_capacity | int < 0 or
            used_capacity | int > total_size | int
          loop: "{{ final_nisd_resources }}"
          loop_control:
            label: "{{ item.id }}"

        # =====================================================
        # 13. Final result
        # =====================================================

        - name: "{{ recipe_name }}: Print sequential allocation summary."
          debug:
            msg:
              - >-
                Requested allocation attempts:
                {{ allocation_iterations }}
              - >-
                Successful allocations:
                {{ successful_allocations | length }}
              - >-
                Capacity exhausted:
                {{ allocation_exhausted }}
              - >-
                Requested size per VDEV:
                {{ requested_vdev_size }}
              - >-
                Replica count:
                {{ expected_replica_count }}
              - >-
                Total logical VDEV capacity allocated:
                {{
                  successful_allocations | length
                  * requested_vdev_size | int
                }}
              - "Sequential allocation validation passed."

        - name: "{{ recipe_name }}: Stop mdsvc-api server and TiDB playground."
          set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'teardown') }}"

        - name: "{{ recipe_name }}: Debug teardown status."
          debug:
            msg: "{{ teardown_status }}"

      rescue:

        - name: "{{ recipe_name }}: Print failure context."
          debug:
            msg:
              - "Sequential VDEV allocation validation failed."
              - >-
                Successful allocations:
                {{ successful_allocations | default([]) | length }}
              - >-
                Capacity exhausted:
                {{ allocation_exhausted | default(false) }}
              - >-
                Allocation failure:
                {{ allocation_failure | default({}) }}

        - name: "{{ recipe_name }}: Fail recipe."
          fail:
            msg: "TiDB sequential allocation validation failed."

        - name: "{{ recipe_name }}: Stop mdsvc-api server and TiDB playground."
          set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'teardown') }}"

        - name: "{{ recipe_name }}: Debug teardown status."
          debug:
            msg: "{{ teardown_status }}"