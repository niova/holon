---
- name: "tidb_snapshot_write_resume_after_failure.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_snapshot_write_resume_after_failure"
    api_base_url: "http://localhost:8081"

    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    vdev_payload: "{{ playbook_dir }}/../examples/create_sample_vdev.json"

    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    nisd_peer_port: "13000"
    nisd_client_port: "13001"

    cp_username: "admin"
    cp_password: "admin"

    niova_block_repo: "{{ lookup('env', 'NIOVA_BLOCK_REPO') | default(playbook_dir ~ '/../..', true) }}"
    snapshot_test_script: "{{ niova_block_repo }}/test/system-tests/snapshot-write-resume-after-failure.sh"
    snapshot_test_helpers: "{{ niova_block_repo }}/test/system-tests/snapshot-test-helpers.sh"
    niova_snapshot_bin: "{{ niova_block_repo }}/scripts/niova-snapshot"

    gossip_path: "{{ lookup('env', 'NIOVA_WORKSPACE') }}/mdsvc-tidb/configs/gossipNodes"
    recipe_state_file: >-
      {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/{{ ClusterParams.raft_uuid }}.json

  tasks:
    - block:

        # ------------------------------------------------------------
        # 0. Preconditions
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Validate application type."
          assert:
            that:
              - app_type == "tidb"
            fail_msg: "This recipe must run with app_type=tidb."

        - name: "{{ recipe_name }}: Generate unique snapshot name."
          set_fact:
            snapshot_name: "snapshot-failure-resume-{{ lookup('pipe', 'date +%s%N') }}"

        - name: "{{ recipe_name }}: Set test log directory."
          set_fact:
            snapshot_test_logdir: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/snapshot-write-resume-after-failure

        - name: "{{ recipe_name }}: Check test script."
          stat:
            path: "{{ snapshot_test_script }}"
          register: snapshot_script_stat

        - name: "{{ recipe_name }}: Check common helper."
          ansible.builtin.stat:
            path: "{{ snapshot_test_helpers }}"
          register: snapshot_helpers_stat

        - name: "{{ recipe_name }}: Assert test files exist."
          assert:
            that:
              - snapshot_script_stat.stat.exists
              - snapshot_helpers_stat.stat.exists

        # ------------------------------------------------------------
        # 1. Start CP
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Start mdsvc-tidb."
          set_fact:
            setup_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

        - name: "{{ recipe_name }}: Wait for mdsvc-api."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code: [200, 301, 302]
          register: api_health
          retries: 90
          delay: 2
          until: api_health.status in [200, 301, 302]

        # ------------------------------------------------------------
        # 2. Login
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Login to mdsvc-api."
          set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username=cp_username,
                  password=cp_password
                )
              }}

        - name: "{{ recipe_name }}: Assert login succeeded."
          assert:
            that:
              - login_result.access_token is defined
              - login_result.access_token | length > 0

        # ------------------------------------------------------------
        # 3. Create infra
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Create infra."
          set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=infra_payload
                )
              }}

        # ------------------------------------------------------------
        # 4. Create NISD backing storage ONCE
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Create NISD backing device."
          vars:
            img_dir: "/snapshot-failure-resume.device"
            bs: "64M"
            count: 160
          debug:
            msg:
              - "{{ lookup('helper', 'create_dd_file', img_dir, bs, count) }}"
          register: nisd_dev_path

        - name: "{{ recipe_name }}: Store NISD backing path."
          set_fact:
            nisd_device_path: "{{ nisd_dev_path.msg[0] }}"

        - name: "{{ recipe_name }}: Capture backing-file identity."
          command:
            argv:
              - stat
              - "-c"
              - "%d:%i:%s"
              - "{{ nisd_device_path }}"
          register: backing_identity_before
          changed_when: false

        # ------------------------------------------------------------
        # 5. Initialize NISD storage exactly once
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Initialize NISD backing storage."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
          debug:
            msg: "{{ lookup('nisd_handler', 'run-niova-block-ctl', input_param) }}"

        # ------------------------------------------------------------
        # 6. Start NISD
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Start NISD."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
          debug:
            msg:
              - "{{ lookup('nisd_handler', 'run_nisd', input_param) }}"

        - name: "{{ recipe_name }}: Wait for recipe state file."
          ansible.builtin.stat:
            path: "{{ recipe_state_file }}"
          register: recipe_state_stat
          retries: 20
          delay: 1
          until: recipe_state_stat.stat.exists

        # ------------------------------------------------------------
        # 7. Create vdev
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Create vdev."
          set_fact:
            vdev_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_vdev',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=vdev_payload
                )
              }}

        - name: "{{ recipe_name }}: Extract vdev UUID."
          set_fact:
            vdev_uuid: "{{ vdev_result.vdev_id | default(vdev_result.uuid) }}"

        - name: "{{ recipe_name }}: Assert vdev UUID."
          assert:
            that:
              - vdev_uuid is defined
              - vdev_uuid | length > 0

        # ------------------------------------------------------------
        # 8. Start one live RW ublk client.
        #    THIS CLIENT IS NOT RESTARTED AFTER SNAPSHOT FAILURE.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Record current ublk devices."
          ansible.builtin.shell: |
            shopt -s nullglob
            for dev in /dev/ublkb*; do printf '%s\n' "$dev"; done
          args:
            executable: /bin/bash
          register: ublk_before
          changed_when: false

        - name: "{{ recipe_name }}: Start live RW niova-ublk."
          vars:
            input_param:
              cp_mode: 1
              enable_auth: 1
              nisd_uuid: "{{ nisd_uuid }}"
              vdev_uuid: "{{ vdev_uuid }}"
              user_name: "{{ cp_username }}"
              user_secret: "{{ cp_password }}"
          set_fact:
            live_ublk_uuid: "{{ lookup('nisd_handler', 'run_ublk_device', input_param) }}"

        - name: "{{ recipe_name }}: Wait for live ublk device."
          ansible.builtin.shell: |
            shopt -s nullglob
            for dev in /dev/ublkb*; do printf '%s\n' "$dev"; done
          args:
            executable: /bin/bash
          register: ublk_after
          changed_when: false
          retries: 40
          delay: 1
          until: >-
            (ublk_after.stdout_lines | difference(ublk_before.stdout_lines) | length) >= 1

        - name: "{{ recipe_name }}: Identify live device."
          set_fact:
            live_devices: "{{ ublk_after.stdout_lines | difference(ublk_before.stdout_lines) }}"

        - name: "{{ recipe_name }}: Require exactly one live device."
          assert:
            that:
              - live_devices | length == 1

        - name: "{{ recipe_name }}: Store live device."
          set_fact:
            live_device: "{{ live_devices[0] }}"

        # ------------------------------------------------------------
        # 9. Healthy baseline write/read before introducing the fault.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Run healthy pre-fault baseline."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" baseline
          args:
            executable: /bin/bash
          environment: &test_environment
            VDEV_UUID: "{{ vdev_uuid }}"
            LIVE_DEVICE: "{{ live_device }}"
            SNAPSHOT_NAME: "{{ snapshot_name }}"
            NIOVA_SNAPSHOT: "{{ niova_snapshot_bin }}"
            TEST_LOGDIR: "{{ snapshot_test_logdir }}"
            SNAPSHOT_TEST_HELPERS: "{{ snapshot_test_helpers }}"
            MDSVC_API_URL: "{{ api_base_url }}"
            INTEGRATION_ADMIN_USERNAME: "{{ cp_username }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ cp_password }}"
            SNAPSHOT_FAIL_TIMEOUT: "45"
            POST_FAILURE_IO_TIMEOUT: "45"
            RECOVERY_TIMEOUT: "90"

            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"
            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"
            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"
            NIOVA_BLOCK_UBLK_UNIFIED: "0"
          register: baseline_result

        - name: "{{ recipe_name }}: Assert baseline passed."
          assert:
            that:
              - baseline_result.rc == 0
              - "'PASS: pre-fault baseline' in baseline_result.stdout"

        # ------------------------------------------------------------
        # 10. Capture and KILL NISD.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Read NISD process state."
          ansible.builtin.slurp:
            src: "{{ recipe_state_file }}"
          register: recipe_state_before_raw

        - name: "{{ recipe_name }}: Extract original NISD PID."
          set_fact:
            old_nisd_pid: >-
              {{
                ((recipe_state_before_raw.content | b64decode | from_json)
                  .nisd_process.process_pid) | int
              }}

        - name: "{{ recipe_name }}: Verify NISD is running."
          shell: "kill -0 {{ old_nisd_pid }}"
          args:
            executable: /bin/bash
          changed_when: false

        - name: "{{ recipe_name }}: Kill NISD."
          command:
            argv:
              - kill
              - "-KILL"
              - "{{ old_nisd_pid | string }}"
          changed_when: true

        - name: "{{ recipe_name }}: Wait until NISD is dead."
          shell: |
            if kill -0 "{{ old_nisd_pid }}" 2>/dev/null; then
              exit 1
            fi
          args:
            executable: /bin/bash
          register: nisd_dead
          changed_when: false
          retries: 30
          delay: 1
          until: nisd_dead.rc == 0

        # ------------------------------------------------------------
        # 11. Trigger snapshot while NISD is unavailable.
        #     The command itself must return failure, not time out.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify snapshot creation fails."
          shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" expect-snapshot-failure
          args:
            executable: /bin/bash
          environment: *test_environment
          register: failed_snapshot_result

        - name: "{{ recipe_name }}: Assert expected snapshot failure was observed."
          assert:
            that:
              - failed_snapshot_result.rc == 0
              - "'PASS: snapshot failed as expected' in failed_snapshot_result.stdout"

        # ------------------------------------------------------------
        # 12. Independent CP assertion: the snapshot exists but is FAILED.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup failed snapshot."
          set_fact:
            failed_snapshot_before_restart: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  params={
                    'vdev_id': vdev_uuid,
                    'name': snapshot_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Assert snapshot is failed, never applied."
          assert:
            that:
              - failed_snapshot_before_restart.status_code | int == 200
              - failed_snapshot_before_restart.state == "failed"
              - failed_snapshot_before_restart.snapshot_id | int > 0
              - failed_snapshot_before_restart.vdev_id == vdev_uuid
              - failed_snapshot_before_restart.name == snapshot_name

        # ------------------------------------------------------------
        # 13. Restart SAME NISD, SAME UUID, SAME backing storage.
        #     Do NOT rerun niova-block-ctl and do NOT restart live ublk.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Restart NISD on existing backing storage."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
          debug:
            msg:
              - "{{ lookup('nisd_handler', 'run_nisd', input_param) }}"

        - name: "{{ recipe_name }}: Read restarted NISD process state."
          slurp:
            src: "{{ recipe_state_file }}"
          register: recipe_state_after_raw
          retries: 20
          delay: 1
          until: >-
            ((recipe_state_after_raw.content | b64decode | from_json)
              .nisd_process.process_pid | int) != (old_nisd_pid | int)

        - name: "{{ recipe_name }}: Extract restarted NISD PID."
          set_fact:
            new_nisd_pid: >-
              {{
                ((recipe_state_after_raw.content | b64decode | from_json)
                  .nisd_process.process_pid) | int
              }}

        - name: "{{ recipe_name }}: Assert NISD was actually restarted."
          assert:
            that:
              - new_nisd_pid | int > 0
              - new_nisd_pid | int != old_nisd_pid | int

        - name: "{{ recipe_name }}: Verify restarted NISD is alive."
          shell: "kill -0 {{ new_nisd_pid }}"
          args:
            executable: /bin/bash
          changed_when: false
          register: restarted_nisd_alive
          retries: 20
          delay: 1
          until: restarted_nisd_alive.rc == 0

        - name: "{{ recipe_name }}: Capture backing-file identity after restart."
          command:
            argv:
              - stat
              - "-c"
              - "%d:%i:%s"
              - "{{ nisd_device_path }}"
          register: backing_identity_after
          changed_when: false

        - name: "{{ recipe_name }}: Assert same backing storage was reused."
          assert:
            that:
              - backing_identity_after.stdout == backing_identity_before.stdout

        # ------------------------------------------------------------
        # 14. Critical assertion: same live client must write/read again.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify writes resume after snapshot failure."
          shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" verify-writes-resume
          args:
            executable: /bin/bash
          environment: *test_environment
          register: write_resume_result

        - name: "{{ recipe_name }}: Assert post-failure write/read succeeded."
          assert:
            that:
              - write_resume_result.rc == 0
              - "'PASS: writes resume after snapshot failure' in write_resume_result.stdout"

        # ------------------------------------------------------------
        # 15. Independent final CP check.
        #     Restarting NISD must not turn the failed snapshot into applied.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup failed snapshot after NISD restart."
          set_fact:
            failed_snapshot_after_restart: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  params={
                    'vdev_id': vdev_uuid,
                    'name': snapshot_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Verify failed snapshot state is stable."
          assert:
            that:
              - failed_snapshot_after_restart.state == "failed"
              - failed_snapshot_after_restart.snapshot_id | int ==
                failed_snapshot_before_restart.snapshot_id | int

        - name: "{{ recipe_name }}: Report success."
          debug:
            msg:
              - "Writes-resume-after-snapshot-failure test PASSED"
              - "snapshot={{ snapshot_name }}"
              - "snapshot_id={{ failed_snapshot_after_restart.snapshot_id }}"
              - "snapshot_state=failed"
              - "old_nisd_pid={{ old_nisd_pid }}"
              - "new_nisd_pid={{ new_nisd_pid }}"
              - "same_live_device={{ live_device }}"
              - "same_backing_storage={{ nisd_device_path }}"
              - "post-failure write/read=success"

      always:
        # A failed snapshot is intentionally not deleted with normal snapshot
        # delete, because delete is defined for applied snapshots. Teardown
        # removes this isolated test environment.
        - name: "{{ recipe_name }}: Stop mdsvc-api and TiDB stack."
          set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          failed_when: false
