# Common snapshot environment setup:
#   - Start mdsvc-tidb / CP
#   - Login
#   - Create infrastructure
#   - Create and initialize NISD
#   - Create VDEV
#   - Start live RW niova-ublk
#   - Discover live /dev/ublkbN device
- import_playbook: tidb_snapshot_setup.yml

- name: "tidb_snapshot_write_resume_after_failure.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_snapshot_write_resume_after_failure"
    api_base_url: "http://localhost:8081"

    # Must match tidb_snapshot_setup.yml because this test restarts
    # the SAME NISD after intentionally killing it.
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    nisd_peer_port: "13000"
    nisd_client_port: "13001"
    cp_username: "admin"
    cp_password: "admin"
    niova_block_repo: >-
      {{
        lookup('env', 'NIOVA_BLOCK_REPO')
        | default(playbook_dir ~ '/../..', true)
      }}
    snapshot_test_script: >-
      {{ niova_block_repo }}/test/system-tests/snapshot-write-resume-after-failure.sh
    snapshot_test_helpers: >-
      {{ niova_block_repo }}/test/system-tests/snapshot-test-helpers.sh
    niova_snapshot_bin: >-
      {{ niova_block_repo }}/scripts/niova-snapshot
    gossip_path: >-
      {{ lookup('env', 'NIOVA_WORKSPACE') }}/mdsvc-tidb/configs/gossipNodes
    recipe_state_file: >-
      {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/{{ ClusterParams.raft_uuid }}.json

  tasks:
    - block:

        # ------------------------------------------------------------
        # 1. Prepare failure/recovery test
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Generate unique snapshot name."
          ansible.builtin.set_fact:
            snapshot_name: "snapshot-failure-resume-{{ lookup('pipe', 'date +%s%N') }}"

        - name: "{{ recipe_name }}: Set test log directory."
          ansible.builtin.set_fact:
            snapshot_test_logdir: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/snapshot-write-resume-after-failure

        - name: "{{ recipe_name }}: Check test script."
          ansible.builtin.stat:
            path: "{{ snapshot_test_script }}"
          register: snapshot_script_stat

        - name: "{{ recipe_name }}: Check common helper."
          ansible.builtin.stat:
            path: "{{ snapshot_test_helpers }}"
          register: snapshot_helpers_stat

        - name: "{{ recipe_name }}: Assert test files exist."
          ansible.builtin.assert:
            that:
              - snapshot_script_stat.stat.exists
              - snapshot_helpers_stat.stat.exists
            fail_msg: >-
              Snapshot test script or helper is missing.

        # ------------------------------------------------------------
        # 2. Verify values provided by tidb_snapshot_setup.yml
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify common snapshot setup results."
          ansible.builtin.assert:
            that:
              - snapshot_login_result is defined
              - snapshot_login_result.access_token is defined
              - snapshot_login_result.access_token | length > 0

              - snapshot_vdev_uuid is defined
              - snapshot_vdev_uuid | length > 0

              - snapshot_live_device is defined
              - snapshot_live_device | length > 0

              - snapshot_nisd_device_path is defined
              - snapshot_nisd_device_path | length > 0
            fail_msg: >-
              tidb_snapshot_setup.yml did not provide all required
              snapshot setup values.

        - name: "{{ recipe_name }}: Verify live block device."
          ansible.builtin.stat:
            path: "{{ snapshot_live_device }}"
          register: live_device_stat

        - name: "{{ recipe_name }}: Assert live block device is ready."
          ansible.builtin.assert:
            that:
              - live_device_stat.stat.exists
              - live_device_stat.stat.isblk | default(false)
            fail_msg: >-
              Live ublk device is not ready:
              {{ snapshot_live_device }}

        # ------------------------------------------------------------
        # 3. Capture persistent backing-file identity
        #
        # The backing storage was created and initialized by
        # tidb_snapshot_setup.yml. Record its identity now so that
        # we can prove the exact same backing storage is reused.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Capture backing-file identity."
          ansible.builtin.command:
            argv:
              - stat
              - "-c"
              - "%d:%i:%s"
              - "{{ snapshot_nisd_device_path }}"
          register: backing_identity_before
          changed_when: false

        # ------------------------------------------------------------
        # 4. Wait for recipe state file
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Wait for recipe state file."
          ansible.builtin.stat:
            path: "{{ recipe_state_file }}"
          register: recipe_state_stat
          retries: 20
          delay: 1
          until: recipe_state_stat.stat.exists

        # ------------------------------------------------------------
        # 5. Healthy baseline write/read before introducing fault
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Run healthy pre-fault baseline."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" baseline
          args:
            executable: /bin/bash
          environment: &test_environment
            VDEV_UUID: "{{ snapshot_vdev_uuid }}"
            LIVE_DEVICE: "{{ snapshot_live_device }}"
            SNAPSHOT_NAME: "{{ snapshot_name }}"

            NIOVA_SNAPSHOT: "{{ niova_snapshot_bin }}"

            TEST_LOGDIR: "{{ snapshot_test_logdir }}"
            SNAPSHOT_TEST_HELPERS: "{{ snapshot_test_helpers }}"

            MDSVC_API_URL: "{{ api_base_url }}"

            INTEGRATION_ADMIN_USERNAME: "{{ cp_username }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ cp_password }}"

            SNAPSHOT_FAIL_TIMEOUT: "45"
            POST_FAILURE_IO_TIMEOUT: "45"
            RECOVERY_TIMEOUT: "90"

            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"
            NIOVA_BLOCK_UBLK_UNIFIED: "0"

          register: baseline_result

        - name: "{{ recipe_name }}: Assert baseline passed."
          ansible.builtin.assert:
            that:
              - baseline_result.rc == 0
              - "'PASS: pre-fault baseline' in baseline_result.stdout"
            fail_msg: >-
              Healthy pre-fault baseline failed.

        # ------------------------------------------------------------
        # 6. Capture and kill NISD
        #
        # The existing live ublk client remains running.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Read NISD process state."
          ansible.builtin.slurp:
            src: "{{ recipe_state_file }}"
          register: recipe_state_before_raw

        - name: "{{ recipe_name }}: Extract original NISD PID."
          ansible.builtin.set_fact:
            old_nisd_pid: >-
              {{
                (
                  (recipe_state_before_raw.content | b64decode | from_json)
                  .nisd_process.process_pid
                ) | int
              }}

        - name: "{{ recipe_name }}: Verify NISD is running."
          ansible.builtin.shell: "kill -0 {{ old_nisd_pid }}"
          args:
            executable: /bin/bash
          changed_when: false

        - name: "{{ recipe_name }}: Kill NISD."
          ansible.builtin.command:
            argv:
              - kill
              - "-KILL"
              - "{{ old_nisd_pid | string }}"
          changed_when: true

        - name: "{{ recipe_name }}: Wait until NISD is dead."
          ansible.builtin.shell: |
            if kill -0 "{{ old_nisd_pid }}" 2>/dev/null; then
                exit 1
            fi
          args:
            executable: /bin/bash
          register: nisd_dead
          changed_when: false
          retries: 30
          delay: 1
          until: nisd_dead.rc == 0

        # ------------------------------------------------------------
        # 7. Trigger snapshot while NISD is unavailable
        #
        # Snapshot creation must fail normally rather than hanging.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify snapshot creation fails."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" expect-snapshot-failure
          args:
            executable: /bin/bash
          environment: *test_environment
          register: failed_snapshot_result

        - name: "{{ recipe_name }}: Assert expected snapshot failure was observed."
          ansible.builtin.assert:
            that:
              - failed_snapshot_result.rc == 0
              - "'PASS: snapshot failed as expected' in failed_snapshot_result.stdout"
            fail_msg: >-
              Expected snapshot failure was not observed.

        # ------------------------------------------------------------
        # 8. Independent CP assertion:
        #    snapshot exists, but state must be failed
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup failed snapshot."
          ansible.builtin.set_fact:
            failed_snapshot_before_restart: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=snapshot_login_result.access_token,
                  params={
                    'vdev_id': snapshot_vdev_uuid,
                    'name': snapshot_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Assert snapshot is failed, never applied."
          ansible.builtin.assert:
            that:
              - failed_snapshot_before_restart.status_code | int == 200
              - failed_snapshot_before_restart.state == "failed"
              - failed_snapshot_before_restart.snapshot_id | int > 0
              - failed_snapshot_before_restart.vdev_id == snapshot_vdev_uuid
              - failed_snapshot_before_restart.name == snapshot_name
            fail_msg: >-
              Snapshot did not enter the expected failed state:
              {{ failed_snapshot_before_restart }}

        # ------------------------------------------------------------
        # 9. Restart SAME NISD using SAME backing storage
        #
        # IMPORTANT:
        #   - Do NOT rerun niova-block-ctl
        #   - Do NOT restart the live ublk client
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Restart NISD on existing backing storage."
          vars:
            input_param:
              nisd_device_path: "{{ snapshot_nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
          ansible.builtin.debug:
            msg:
              - "{{ lookup('nisd_handler', 'run_nisd', input_param) }}"

        # ------------------------------------------------------------
        # 10. Verify restarted NISD
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Read restarted NISD process state."
          ansible.builtin.slurp:
            src: "{{ recipe_state_file }}"
          register: recipe_state_after_raw
          retries: 20
          delay: 1
          until: >-
            (
              (recipe_state_after_raw.content | b64decode | from_json)
              .nisd_process.process_pid | int
            ) != (old_nisd_pid | int)

        - name: "{{ recipe_name }}: Extract restarted NISD PID."
          ansible.builtin.set_fact:
            new_nisd_pid: >-
              {{
                (
                  (recipe_state_after_raw.content | b64decode | from_json)
                  .nisd_process.process_pid
                ) | int
              }}

        - name: "{{ recipe_name }}: Assert NISD was actually restarted."
          ansible.builtin.assert:
            that:
              - new_nisd_pid | int > 0
              - new_nisd_pid | int != old_nisd_pid | int
            fail_msg: >-
              NISD PID did not change after restart.

        - name: "{{ recipe_name }}: Verify restarted NISD is alive."
          ansible.builtin.shell: "kill -0 {{ new_nisd_pid }}"
          args:
            executable: /bin/bash
          changed_when: false
          register: restarted_nisd_alive
          retries: 20
          delay: 1
          until: restarted_nisd_alive.rc == 0

        # ------------------------------------------------------------
        # 11. Verify exact same backing storage was reused
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Capture backing-file identity after restart."
          ansible.builtin.command:
            argv:
              - stat
              - "-c"
              - "%d:%i:%s"
              - "{{ snapshot_nisd_device_path }}"
          register: backing_identity_after
          changed_when: false

        - name: "{{ recipe_name }}: Assert same backing storage was reused."
          ansible.builtin.assert:
            that:
              - backing_identity_after.stdout == backing_identity_before.stdout
            fail_msg: >-
              NISD backing storage changed across restart.
              before={{ backing_identity_before.stdout }}
              after={{ backing_identity_after.stdout }}

        # ------------------------------------------------------------
        # 12. Critical assertion:
        #     SAME live client must be able to write/read again
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify writes resume after snapshot failure."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}" verify-writes-resume
          args:
            executable: /bin/bash
          environment: *test_environment
          register: write_resume_result

        - name: "{{ recipe_name }}: Assert post-failure write/read succeeded."
          ansible.builtin.assert:
            that:
              - write_resume_result.rc == 0
              - "'PASS: writes resume after snapshot failure' in write_resume_result.stdout"
            fail_msg: >-
              Writes did not resume after NISD recovery.

        # ------------------------------------------------------------
        # 13. Independent final CP check
        #
        # Restarting NISD must NOT turn the failed snapshot into an
        # applied snapshot.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup failed snapshot after NISD restart."
          ansible.builtin.set_fact:
            failed_snapshot_after_restart: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=snapshot_login_result.access_token,
                  params={
                    'vdev_id': snapshot_vdev_uuid,
                    'name': snapshot_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Verify failed snapshot state is stable."
          ansible.builtin.assert:
            that:
              - failed_snapshot_after_restart.status_code | int == 200
              - failed_snapshot_after_restart.state == "failed"

              - failed_snapshot_after_restart.snapshot_id | int ==
                failed_snapshot_before_restart.snapshot_id | int

              - failed_snapshot_after_restart.vdev_id == snapshot_vdev_uuid
              - failed_snapshot_after_restart.name == snapshot_name

            fail_msg: >-
              Failed snapshot state changed after NISD restart.
              before={{ failed_snapshot_before_restart }}
              after={{ failed_snapshot_after_restart }}

        - name: "{{ recipe_name }}: Report success."
          ansible.builtin.debug:
            msg:
              - "Writes-resume-after-snapshot-failure test PASSED"
              - "vdev={{ snapshot_vdev_uuid }}"
              - "snapshot={{ snapshot_name }}"
              - "snapshot_id={{ failed_snapshot_after_restart.snapshot_id }}"
              - "snapshot_state=failed"
              - "old_nisd_pid={{ old_nisd_pid }}"
              - "new_nisd_pid={{ new_nisd_pid }}"
              - "same_live_device={{ snapshot_live_device }}"
              - "same_backing_storage={{ snapshot_nisd_device_path }}"
              - "post-failure write/read=success"

      always:

        # ------------------------------------------------------------
        # Cleanup
        #
        # The failed snapshot is intentionally not deleted through
        # normal snapshot delete because delete is defined for applied
        # snapshots. Docker teardown removes the isolated environment.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Stop mdsvc-api and TiDB stack."
          ansible.builtin.set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          failed_when: false