- name: "tidb_mount_counter_progression_validation.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_mount_counter_progression_validation"
    api_base_url: "http://localhost:8081"
    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    vdev_payload: "{{ playbook_dir }}/../examples/create_sample_vdev.json"
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"

  tasks:
    - block:

        - name: "{{ recipe_name }}: Check if app_type is tidb."
          debug:
            msg: "app_type is: {{ app_type }}"
          failed_when: app_type != "tidb"

        # ----------------------------------------
        # 1. Start mdsvc-tidb Docker stack
        # ----------------------------------------

        - name: "{{ recipe_name }}: Start mdsvc-tidb using Docker."
          set_fact:
            docker_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

        - name: "{{ recipe_name }}: Debug Docker status."
          debug:
            var: docker_status

        - name: "{{ recipe_name }}: Wait for mdsvc-api to become ready."
          uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code: [200, 301, 302]
          register: api_health
          retries: 30
          delay: 2
          until: api_health.status in [200, 301, 302]

        # ----------------------------------------
        # 2. Login
        # ----------------------------------------

        - name: "{{ recipe_name }}: Login to mdsvc-api."
          set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username='admin',
                  password='admin'
                )
              }}

        - name: "{{ recipe_name }}: Debug login result."
          debug:
            msg: "Login successful"

        # ----------------------------------------
        # 3. Create Infra
        # ----------------------------------------

        - name: "{{ recipe_name }}: Create infra."
          set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=infra_payload
                )
              }}

        - name: "{{ recipe_name }}: Debug infra response."
          debug:
            var: infra_result

        # ----------------------------------------
        # 4. Create local NISD backing device
        # 10 GiB = 64M * 160
        # ----------------------------------------

        - name: "{{ recipe_name }}: Create NISD device file."
          vars:
            img_dir: "/sample.device"
            bs: "64M"
            count: 160
          debug:
            msg:
              - "{{ lookup('helper', 'create_dd_file', img_dir, bs, count) }}"
          register: nisd_dev_path

        - name: "{{ recipe_name }}: Print NISD device path."
          debug:
            msg: "{{ nisd_dev_path.msg[0] }}"

        # ----------------------------------------
        # 5. Start niova-block-ctl
        # ----------------------------------------

        - name: "{{ recipe_name }}: Start niova-block-ctl process."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_dev_path.msg[0] }}"
              nisd_uuid: "{{ nisd_uuid }}"
          debug:
            msg: "{{ lookup('nisd_handler', 'run-niova-block-ctl', input_param) }}"

        # ----------------------------------------
        # 6. Start NISD
        # ----------------------------------------

        - name: "{{ recipe_name }}: Start NISD."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_dev_path.msg[0] }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "13000"
              client_port: "13001"
              enable_auth: 1
          debug:
            msg:
              - "{{ lookup('nisd_handler', 'run_nisd', input_param) }}"

        # ----------------------------------------
        # 7. Create VDEV
        # ----------------------------------------

        - name: "{{ recipe_name }}: Create vdev."
          set_fact:
            vdev_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_vdev',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=vdev_payload
                )
              }}

        - name: "{{ recipe_name }}: Debug vdev result."
          debug:
            var: vdev_result

        - name: "{{ recipe_name }}: Extract vdev UUID."
          set_fact:
            vdev_uuid: "{{ vdev_result.vdev_id | default(vdev_result.uuid) }}"

        - name: "{{ recipe_name }}: Print vdev UUID."
          debug:
            msg: "Created VDEV UUID: {{ vdev_uuid }}"

        - name: "{{ recipe_name }}: Get mount counter before starting ublk."
          set_fact:
            nisd_result_before: >-
              {{
                lookup(
                  'tidb_api',
                  'mount_vdev',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  body={
                    'vdev_id': vdev_uuid
                  }
                )
              }}

        - name: "{{ recipe_name }}: Print nisd result."
          debug:
            msg: "{{ nisd_result_before }}"

        - name: "{{ recipe_name }}: Wait before starting niova-ublk."
          pause:
            seconds: 25

        # ----------------------------------------
        # 8. Start niova-block-test
        # ----------------------------------------

        - name: "{{ recipe_name }}: Start ublk device"
          vars:
            input_param: {
              'enable_auth': 1,
              'cp_mode': 1,
              'user_name': 'admin',
              'user_secret': 'admin',
              'nisd_uuid': '{{ nisd_uuid }}',
              'vdev_uuid': '{{ vdev_uuid }}'
            }
          debug:
            msg:
              - "{{ lookup('nisd_handler', 'run_ublk_device', input_param) }}"
          register: ublk_uuid

        - name: "{{ recipe_name }}: Debug niova-ublk result."
          debug:
            msg: "{{ ublk_uuid }}"

        - name: "{{ recipe_name }}: Get mount counter after starting ublk."
          set_fact:
            nisd_result: >-
              {{
                lookup(
                  'tidb_api',
                  'mount_vdev',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  body={
                    'vdev_id': vdev_uuid
                  }
                )
              }}

        - name: "{{ recipe_name }}: Print nisd result."
          debug:
            msg: "{{ nisd_result }}"

      rescue:
        - name: "Recipe: {{ recipe_name }} failed"
          set_fact:
            terminate_recipe: true