---
- import_playbook: tidb_snapshot_setup.yml

- name: "tidb_snapshot_lifecycle_regression.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_snapshot_lifecycle_regression"
    api_base_url: "http://localhost:8081"
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    cp_username: "admin"
    cp_password: "admin"
    niova_block_repo: >-
      {{
        lookup('env', 'NIOVA_BLOCK_REPO')
        | default(playbook_dir ~ '/../..', true)
      }}
    regression_script: >-
      {{ niova_block_repo }}/test/system-tests/snapshot-lifecycle-regression.sh
    niova_snapshot_bin: >-
      {{ niova_block_repo }}/scripts/niova-snapshot
    niova_ublk_bin: >-
      {{
        (lookup('env', 'NIOVA_BIN_PATH') ~ '/bin/niova-ublk')
        if lookup('env', 'NIOVA_BIN_PATH')
        else 'niova-ublk'
      }}
    gossip_path: >-
      {{ lookup('env', 'NIOVA_WORKSPACE') }}/mdsvc-tidb/configs/gossipNodes
    max_iterations: 1000
    preserve_environment_on_failure: true

  tasks:
    - name: "Run snapshot lifecycle regression test"
      block:

        # ------------------------------------------------------------
        # 1. Verify regression test dependencies
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify regression script."
          ansible.builtin.stat:
            path: "{{ regression_script }}"
          register: regression_script_stat

        - name: "{{ recipe_name }}: Assert regression script exists."
          ansible.builtin.assert:
            that:
              - regression_script_stat.stat.exists
            fail_msg: "Missing {{ regression_script }}"

        # ------------------------------------------------------------
        # 2. Verify common snapshot setup
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify common snapshot setup results."
          ansible.builtin.assert:
            that:
              - snapshot_login_result is defined
              - snapshot_login_result.access_token is defined
              - snapshot_login_result.access_token | length > 0

              - snapshot_vdev_uuid is defined
              - snapshot_vdev_uuid | length > 0

              - snapshot_live_device is defined
              - snapshot_live_device | length > 0

              - snapshot_live_ublk_uuid is defined
              - snapshot_live_ublk_uuid | length > 0

              - snapshot_nisd_device_path is defined
              - snapshot_nisd_device_path | length > 0

            fail_msg: >-
              tidb_snapshot_setup.yml did not provide all required
              snapshot setup values.

        - name: "{{ recipe_name }}: Set regression log directory."
          ansible.builtin.set_fact:
            regression_logdir: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/snapshot-lifecycle-regression

        # ------------------------------------------------------------
        # 3. Resolve service PIDs for health/evidence checks
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Resolve service PIDs."
          ansible.builtin.shell: |
            set -o pipefail

            nisd_pid="$(
              pgrep -n -f '(^|/)nisd([[:space:]]|$).*{{ nisd_uuid }}' ||
              true
            )"

            ublk_pid="$(
              pgrep -n -f '(^|/)niova-ublk([[:space:]]|$).*{{ snapshot_vdev_uuid }}' ||
              true
            )"

            printf 'NISD_PID=%s\nLIVE_UBLK_PID=%s\n' \
              "$nisd_pid" "$ublk_pid"
          args:
            executable: /bin/bash
          register: service_ids
          changed_when: false

        # ------------------------------------------------------------
        # 4. Run bounded snapshot lifecycle regression
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Run bounded lifecycle loop."
          ansible.builtin.shell: >-
            timeout
            --signal=TERM
            --kill-after=30s
            {{ ((max_iterations | int) * 15 + 60) }}m
            bash {{ regression_script | quote }}
          args:
            executable: /bin/bash

          environment:
            VDEV_UUID: "{{ snapshot_vdev_uuid }}"
            LIVE_DEVICE: "{{ snapshot_live_device }}"
            MAX_ITERATIONS: "{{ max_iterations | string }}"
            TEST_LOGDIR: "{{ regression_logdir }}"
            NIOVA_SNAPSHOT: "{{ niova_snapshot_bin }}"
            NIOVA_UBLK: "{{ niova_ublk_bin }}"
            MDSVC_API_URL: "{{ api_base_url }}"
            INTEGRATION_ADMIN_USERNAME: "{{ cp_username }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ cp_password }}"
            NISD_PID: >-
              {{
                service_ids.stdout
                | regex_search('NISD_PID=([^\\n]*)', '\\1')
                | first
                | default('')
              }}
            LIVE_UBLK_PID: >-
              {{
                service_ids.stdout
                | regex_search('LIVE_UBLK_PID=([^\\n]*)', '\\1')
                | first
                | default('')
              }}
            NISD_LOG: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/nisd-{{ nisd_uuid }}.log
            LIVE_UBLK_LOG: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/niova-ublk-{{ snapshot_live_ublk_uuid }}.log
            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"
            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"
            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"
            NIOVA_BLOCK_UBLK_UNIFIED: "0"
          register: regression_result

      rescue:

        # ------------------------------------------------------------
        # Preserve environment after regression failure
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Mark regression as failed."
          ansible.builtin.set_fact:
            regression_failed: true

        - name: "{{ recipe_name }}: Report preserved diagnostic state."
          ansible.builtin.debug:
            msg: >-
              Regression stopped. Environment was not restarted or
              torn down. Artifacts:
              {{ regression_logdir | default('not initialized') }}

        - name: "{{ recipe_name }}: Fail regression."
          ansible.builtin.fail:
            msg: >-
              Snapshot lifecycle regression failed;
              diagnostic state preserved.

      always:

        # ------------------------------------------------------------
        # Cleanup only after successful regression
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Clean up after successful run."
          ansible.builtin.set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          when:
            - not (regression_failed | default(false))
            - regression_result is defined
            - regression_result.rc == 0
          failed_when: false