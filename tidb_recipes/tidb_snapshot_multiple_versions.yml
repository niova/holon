---
# Common snapshot environment setup:
#   - Start mdsvc-tidb
#   - Login to control plane
#   - Create infrastructure
#   - Create and initialize NISD
#   - Create VDEV
#   - Start live RW niova-ublk
#   - Discover live /dev/ublkbN device
- import_playbook: tidb_snapshot_setup.yml

- name: "tidb_snapshot_multiple_versions.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_snapshot_multiple_versions"

    api_base_url: "http://localhost:8081"

    cp_username: "admin"
    cp_password: "admin"

    niova_block_repo: >-
      {{
        lookup('env', 'NIOVA_BLOCK_REPO')
        | default(playbook_dir ~ '/../..', true)
      }}

    snapshot_test_script: >-
      {{ niova_block_repo }}/test/system-tests/snapshot-multiple-versions.sh

    niova_snapshot_bin: >-
      {{ niova_block_repo }}/scripts/niova-snapshot

    niova_ublk_bin: >-
      {{
        (lookup('env', 'NIOVA_BIN_PATH') ~ '/bin/niova-ublk')
        if lookup('env', 'NIOVA_BIN_PATH')
        else 'niova-ublk'
      }}

    gossip_path: >-
      {{ lookup('env', 'NIOVA_WORKSPACE') }}/mdsvc-tidb/configs/gossipNodes

  tasks:
    - block:

        # ------------------------------------------------------------
        # 1. Prepare multiple-snapshot test
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Generate unique snapshot names."
          ansible.builtin.set_fact:
            snapshot_run_id: "{{ lookup('pipe', 'date +%s%N') }}"

        - name: "{{ recipe_name }}: Store snapshot names."
          ansible.builtin.set_fact:
            snapshot1_name: "snapshot-multi-1-{{ snapshot_run_id }}"
            snapshot2_name: "snapshot-multi-2-{{ snapshot_run_id }}"

        - name: "{{ recipe_name }}: Build test log directory."
          ansible.builtin.set_fact:
            snapshot_test_logdir: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/snapshot-multiple-versions

        - name: "{{ recipe_name }}: Verify test script exists."
          ansible.builtin.stat:
            path: "{{ snapshot_test_script }}"
          register: snapshot_script_stat

        - name: "{{ recipe_name }}: Assert test script exists."
          ansible.builtin.assert:
            that:
              - snapshot_script_stat.stat.exists
            fail_msg: >-
              Snapshot test script not found:
              {{ snapshot_test_script }}

        - name: "{{ recipe_name }}: Verify niova-snapshot exists."
          ansible.builtin.stat:
            path: "{{ niova_snapshot_bin }}"
          register: snapshot_cli_stat

        - name: "{{ recipe_name }}: Assert niova-snapshot exists."
          ansible.builtin.assert:
            that:
              - snapshot_cli_stat.stat.exists
            fail_msg: >-
              niova-snapshot not found:
              {{ niova_snapshot_bin }}

        # ------------------------------------------------------------
        # 2. Verify common snapshot setup
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify snapshot setup results."
          ansible.builtin.assert:
            that:
              - snapshot_login_result is defined
              - snapshot_login_result.access_token is defined
              - snapshot_login_result.access_token | length > 0

              - snapshot_vdev_uuid is defined
              - snapshot_vdev_uuid | length > 0

              - snapshot_live_device is defined
              - snapshot_live_device | length > 0
            fail_msg: >-
              Snapshot test setup did not provide all required values.

        - name: "{{ recipe_name }}: Verify live block device."
          ansible.builtin.stat:
            path: "{{ snapshot_live_device }}"
          register: live_device_stat

        - name: "{{ recipe_name }}: Assert live block device is ready."
          ansible.builtin.assert:
            that:
              - live_device_stat.stat.exists
              - live_device_stat.stat.isblk | default(false)
            fail_msg: >-
              Live ublk device is not ready:
              {{ snapshot_live_device }}

        # ------------------------------------------------------------
        # 3. Run multiple-snapshot data-path test
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Run multiple snapshot version test."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}"
          args:
            executable: /bin/bash
          environment:
            VDEV_UUID: "{{ snapshot_vdev_uuid }}"
            LIVE_DEVICE: "{{ snapshot_live_device }}"

            SNAPSHOT1_NAME: "{{ snapshot1_name }}"
            SNAPSHOT2_NAME: "{{ snapshot2_name }}"

            NIOVA_SNAPSHOT: "{{ niova_snapshot_bin }}"
            NIOVA_UBLK: "{{ niova_ublk_bin }}"

            MDSVC_API_URL: "{{ api_base_url }}"

            INTEGRATION_ADMIN_USERNAME: "{{ cp_username }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ cp_password }}"

            TEST_LOGDIR: "{{ snapshot_test_logdir }}"

            # Keep both snapshots after the shell assertions so this
            # recipe can independently validate them through tidb_api.
            DELETE_SNAPSHOTS_ON_SUCCESS: "0"

            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"
            NIOVA_BLOCK_UBLK_UNIFIED: "0"

          register: snapshot_test_result

        - name: "{{ recipe_name }}: Print snapshot test output."
          ansible.builtin.debug:
            var: snapshot_test_result.stdout_lines

        - name: "{{ recipe_name }}: Assert shell test succeeded."
          ansible.builtin.assert:
            that:
              - snapshot_test_result.rc == 0
              - "'PASS: multiple snapshot version preservation test' in snapshot_test_result.stdout"
            fail_msg: >-
              Multiple snapshot version test failed.
              Logs: {{ snapshot_test_logdir }}

        # ------------------------------------------------------------
        # 4. Independently verify snapshot 1 through CP
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup snapshot 1 in CP."
          ansible.builtin.set_fact:
            snapshot1_info: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=snapshot_login_result.access_token,
                  params={
                    'vdev_id': snapshot_vdev_uuid,
                    'name': snapshot1_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Validate snapshot 1."
          ansible.builtin.assert:
            that:
              - snapshot1_info.status_code | int == 200
              - snapshot1_info.state == "applied"
              - snapshot1_info.snapshot_id is defined
              - snapshot1_info.snapshot_id | int > 0
              - snapshot1_info.vdev_id == snapshot_vdev_uuid
              - snapshot1_info.name == snapshot1_name
            fail_msg: >-
              Snapshot 1 CP validation failed:
              {{ snapshot1_info }}

        # ------------------------------------------------------------
        # 5. Independently verify snapshot 2 through CP
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup snapshot 2 in CP."
          ansible.builtin.set_fact:
            snapshot2_info: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=snapshot_login_result.access_token,
                  params={
                    'vdev_id': snapshot_vdev_uuid,
                    'name': snapshot2_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Validate snapshot 2 and ID ordering."
          ansible.builtin.assert:
            that:
              - snapshot2_info.status_code | int == 200
              - snapshot2_info.state == "applied"
              - snapshot2_info.snapshot_id is defined
              - snapshot2_info.snapshot_id | int > 0
              - snapshot2_info.vdev_id == snapshot_vdev_uuid
              - snapshot2_info.name == snapshot2_name

              - snapshot2_info.snapshot_id | int !=
                snapshot1_info.snapshot_id | int

              - snapshot2_info.snapshot_id | int >
                snapshot1_info.snapshot_id | int

            fail_msg: >-
              Snapshot 2 CP validation / ID ordering failed.
              snap1={{ snapshot1_info }}
              snap2={{ snapshot2_info }}

        - name: "{{ recipe_name }}: Report successful verification."
          ansible.builtin.debug:
            msg:
              - "Multiple snapshot version preservation test PASSED"
              - "vdev={{ snapshot_vdev_uuid }}"
              - >-
                snapshot1={{ snapshot1_name }}
                id={{ snapshot1_info.snapshot_id }}
                state={{ snapshot1_info.state }}
              - >-
                snapshot2={{ snapshot2_name }}
                id={{ snapshot2_info.snapshot_id }}
                state={{ snapshot2_info.state }}
              - "live_device={{ snapshot_live_device }}"
              - "logs={{ snapshot_test_logdir }}"

      always:

        # ------------------------------------------------------------
        # Cleanup
        #
        # The shell script stops its RO mounts itself.
        # Delete newest snapshot first, then the older snapshot.
        # Cleanup is best-effort so it does not hide the actual
        # test failure.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Delete snapshot 2 if it exists."
          ansible.builtin.command:
            argv:
              - "{{ niova_snapshot_bin }}"
              - "--vdev"
              - "{{ snapshot_vdev_uuid | default('') }}"
              - "--op"
              - "delete"
              - "--snapshot-name"
              - "{{ snapshot2_name | default('') }}"
          environment:
            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"

          register: snapshot2_delete_result
          changed_when: snapshot2_delete_result.rc == 0
          failed_when: false
          when:
            - snapshot_vdev_uuid is defined
            - snapshot2_name is defined

        - name: "{{ recipe_name }}: Delete snapshot 1 if it exists."
          ansible.builtin.command:
            argv:
              - "{{ niova_snapshot_bin }}"
              - "--vdev"
              - "{{ snapshot_vdev_uuid | default('') }}"
              - "--op"
              - "delete"
              - "--snapshot-name"
              - "{{ snapshot1_name | default('') }}"
          environment:
            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"

          register: snapshot1_delete_result
          changed_when: snapshot1_delete_result.rc == 0
          failed_when: false
          when:
            - snapshot_vdev_uuid is defined
            - snapshot1_name is defined

        - name: "{{ recipe_name }}: Stop mdsvc-api and TiDB stack."
          ansible.builtin.set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          failed_when: false