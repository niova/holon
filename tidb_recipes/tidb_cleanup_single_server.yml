            method: GET
            status_code: [200, 301, 302]
          register: cleanup_api_health
          until: cleanup_api_health.status in [200, 301, 302]
          retries: 90
          delay: 3

        - name: "{{ recipe_name }}: Login to control plane."
          ansible.builtin.set_fact:
            login_result: >-
              {{ lookup('tidb_api', 'login', base_url=api_base_url,
                         username=lookup('env', 'INTEGRATION_ADMIN_USERNAME') | default('admin', true),
                         password=lookup('env', 'INTEGRATION_ADMIN_PASSWORD') | default('admin', true)) }}
          no_log: true

        - name: "{{ recipe_name }}: Save access token."
          ansible.builtin.set_fact:
            access_token: "{{ login_result.access_token }}"
          no_log: true

        - name: "{{ recipe_name }}: Assert admin login succeeded."
          ansible.builtin.assert:
            that:
              - access_token | length > 0

        - name: "{{ recipe_name }}: Verify cleanup test endpoint."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/api/cleanup-jobs"
            method: GET
            headers:
              Authorization: "Bearer {{ access_token }}"
            status_code: 200
            return_content: true
          register: cleanup_endpoint_check
          no_log: true

        # =====================================================
        # 2. Execute tenant/VDEV workload with SQL/event checks
        # =====================================================
        # This helper implements isolated tenant provisioning and per-job SQL checks;
        # service lifecycle, authentication and final cleanup stay in Ansible.
        - name: "{{ recipe_name }}: Run cleanup workload and verification."
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/cleanup_worker_verify.py"
              - --mode
              - single
              - --api
              - "{{ api_base_url }}"
              - --server-binary
              - "{{ cleanup_repo_path }}/server"
              - --infra-json
              - "{{ infra_payload }}"
              - --vdev-json
              - "{{ vdev_payload }}"
              - --tenants
              - "{{ cleanup_tenant_count | string }}"
              - --vdevs-per-tenant
              - "{{ cleanup_vdevs_per_tenant | string }}"
              - --mysql-host
              - "{{ ClusterParams.mysql_host }}"
              - --mysql-port
              - "{{ ClusterParams.mysql_port | string }}"
              - --mysql-user
              - "{{ ClusterParams.mysql_user | default('root') }}"
              - --logs
              - "{{ cleanup_logs_dir }}"
              - --wait-seconds
              - "{{ cleanup_timeout_seconds | string }}"
          environment:
            INTEGRATION_ADMIN_USERNAME: "{{ lookup('env', 'INTEGRATION_ADMIN_USERNAME') | default('admin', true) }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ lookup('env', 'INTEGRATION_ADMIN_PASSWORD') | default('admin', true) }}"
            MDSVC_MYSQL_PASSWORD: "{{ ClusterParams.mysql_password | default('') }}"
            MDSVC_TENANT_MANAGER_ID: "{{ ClusterParams.server_env.MDSVC_TENANT_MANAGER_ID | default(lookup('env', 'MDSVC_TENANT_MANAGER_ID')) }}"
          register: cleanup_run
          changed_when: false

        - name: "{{ recipe_name }}: Show verification summary."
          ansible.builtin.debug:
            var: cleanup_run.stdout_lines

      rescue:
        - name: "{{ recipe_name }}: Print failure."
          ansible.builtin.debug:
            msg: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"

        - name: "{{ recipe_name }}: Record failed outcome."
          ansible.builtin.set_fact:
            cleanup_recipe_failed: true
            cleanup_recipe_failure: "{{ ansible_failed_result }}"

      always:
        - name: "{{ recipe_name }}: Restore playground configuration."
          ansible.builtin.set_fact:
            ClusterParams: "{{ playground_cluster_params }}"
          when: playground_cluster_params is defined

        - name: "{{ recipe_name }}: Tear down TiUP Playground."
          ansible.builtin.set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'playground_teardown') }}"
          when: cleanup_setup_done | default(false) | bool

        - name: "{{ recipe_name }}: Restore caller configuration."
          ansible.builtin.set_fact:
            ClusterParams: "{{ original_cluster_params }}"
          when: original_cluster_params is defined

        - name: "{{ recipe_name }}: Fail after cleanup when validation failed."
          ansible.builtin.fail:
            msg: "Cleanup Worker test failed; check previous failure and run logs."
          when: cleanup_recipe_failed | default(false) | bool