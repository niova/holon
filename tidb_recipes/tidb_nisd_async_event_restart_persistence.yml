- name: "tidb_nisd_async_event_restart_persistence.yml"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    recipe_name: "tidb_nisd_async_event_restart_persistence"
    api_base_url: "http://localhost:8081"
    cp_username: "admin"
    cp_password: "admin"
    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    nisd_device_path: "{{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/nisd-async-event-restart.device"
    nisd_device_size: "10G"
    nisd_peer_port: "13000"
    nisd_client_port: "13001"
    nisd_secret: >-
      {{
        lookup('env', 'NIOVA_NISD_SECRET')
        | default('Nisd-secret', true)
      }}
    lookout_uuid: ""
    ncp_event_ping_key: "/ncp_event/ping_enabled"
    ncp_event_sno_key: "/ncp_event/event_sno"
    async_event_action: 250
    async_event_timeout_retries: 60
    async_event_poll_delay: 1
    event_markers:
      - "event-1"
      - "event-2"
      - "event-3"

  tasks:
    - block:
        - name: "{{ recipe_name }}: Check application type."
          ansible.builtin.assert:
            that:
              - app_type == "tidb"
            fail_msg: "This recipe must run with app_type=tidb."

        - name: "{{ recipe_name }}: Start mdsvc-tidb."
          ansible.builtin.set_fact:
            setup_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

        - name: "{{ recipe_name }}: Wait for Control Plane."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code: [200, 301, 302]
            timeout: 10
          register: api_health
          retries: 90
          delay: 2
          until: api_health.status in [200, 301, 302]

        - name: "{{ recipe_name }}: Login to Control Plane."
          ansible.builtin.set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username=cp_username,
                  password=cp_password
                )
              }}

        - name: "{{ recipe_name }}: Create infrastructure."
          ansible.builtin.set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=infra_payload
                )
              }}

        - name: "{{ recipe_name }}: Create fresh NISD backing file."
          ansible.builtin.command:
            argv:
              - truncate
              - -s
              - "{{ nisd_device_size }}"
              - "{{ nisd_device_path }}"
          changed_when: true

        - name: "{{ recipe_name }}: Initialize NISD backing storage."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup(
                  'nisd_handler',
                  'run-niova-block-ctl',
                  input_param
                )
              }}

        - name: "{{ recipe_name }}: Start NISD with async-event handler."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
              enable_cp_event_handler: 1
              nisd_secret: "{{ nisd_secret }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup(
                  'nisd_handler',
                  'run_nisd',
                  input_param
                )
              }}

        - name: "{{ recipe_name }}: Save the PID recorded by this launch."
          ansible.builtin.set_fact:
            first_nisd_pid: "{{ (lookup('file', ClusterParams.base_dir ~ '/' ~ ClusterParams.raft_uuid ~ '/' ~ ClusterParams.raft_uuid ~ '.json') | from_json).nisd_process.process_pid }}"

        - name: "{{ recipe_name }}: Wait for NISD registration."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/api/resource?type=nisd"
            method: GET
            headers:
              Authorization: "Bearer {{ login_result.access_token }}"
            status_code: 200
            return_content: true
          register: nisd_resources
          retries: 30
          delay: 2
          until: >-
            nisd_uuid in (nisd_resources.content | default(''))
          no_log: true

        - name: "{{ recipe_name }}: Wait for async-event ping to become enabled."
          vars:
            stage: "wait_for_async_event_ping"
          ansible.builtin.debug:
            msg: "Waiting for ncp_event ping_enabled=true"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup(
                'niova_ctlrequest',
                'lookup',
                nisd_uuid,
                ncp_event_ping_key,
                'nisd',
                lookout_uuid
              )['/ncp_event/ping_enabled']
              | string
              | lower
            ) in ['1', 'true']

        - name: "{{ recipe_name }}: Read initial event_sno."
          vars:
            stage: "get_initial_event_sno"
            event_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            initial_event_sno: "{{ event_state['/ncp_event/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify initial event_sno."
          ansible.builtin.assert:
            that:
              - initial_event_sno | int == 0
            fail_msg: >-
              Expected fresh NISD event_sno=0, but got
              event_sno={{ initial_event_sno }}.
            success_msg: "Initial event_sno=0."

        - name: "{{ recipe_name }}: Set expected final event serial."
          ansible.builtin.set_fact:
            expected_final_event_sno: "{{ (initial_event_sno | int) + (event_markers | length) }}"

        - name: "{{ recipe_name }}: Resolve NISD log path."
          ansible.builtin.set_fact:
            nisd_log_file: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/nisd_{{ nisd_uuid }}.log

        - name: "{{ recipe_name }}: Record the log size before adding events."
          ansible.builtin.stat:
            path: "{{ nisd_log_file }}"
            get_checksum: false
          register: callback_log

        - name: "{{ recipe_name }}: Initialize this run's event results."
          ansible.builtin.set_fact:
            add_event_results: []

        - name: "{{ recipe_name }}: Add three TEST async events."
          ansible.builtin.set_fact:
            add_event_results: >-
              {{
                add_event_results +
                [
                  lookup(
                    'tidb_api',
                    'add_event',
                    base_url=api_base_url,
                    token=login_result.access_token,
                    body={
                      'nisd_id': nisd_uuid,
                      'action': async_event_action,
                      'params': {
                        'marker': item
                      }
                    }
                  )
                ]
              }}
          loop: "{{ event_markers }}"
          loop_control:
            label: "{{ item }}"

        - name: "{{ recipe_name }}: Verify each queued event and its assigned serial."
          ansible.builtin.assert:
            that:
              - item.data.status == 0
              - item.data.payload.nisd_id == nisd_uuid
              - item.data.payload.action == async_event_action
              - item.data.payload.event_ptr == (initial_event_sno | int) + event_index + 1
          loop: "{{ add_event_results }}"
          loop_control:
            index_var: event_index
            label: "{{ event_markers[event_index] }}"

        - name: "{{ recipe_name }}: Wait until final event_sno is reached."
          vars:
            stage: "wait_for_final_event_sno"
          ansible.builtin.debug:
            msg: "Waiting for event_sno={{ expected_final_event_sno }}"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup(
                'niova_ctlrequest',
                'lookup',
                nisd_uuid,
                ncp_event_sno_key,
                'nisd',
                lookout_uuid
              )['/ncp_event/event_sno']
              | int
            ) >= (expected_final_event_sno | int)

        - name: "{{ recipe_name }}: Read final event_sno."
          vars:
            stage: "get_final_event_sno"
            final_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            final_event_sno: "{{ final_state['/ncp_event/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify final durable event_sno."
          ansible.builtin.assert:
            that:
              - final_event_sno | int == expected_final_event_sno | int
            fail_msg: >-
              Expected final event_sno={{ expected_final_event_sno }},
              but got event_sno={{ final_event_sno }}.
            success_msg: >-
              Final event_sno reached {{ final_event_sno }}.

        - name: "{{ recipe_name }}: Verify the TEST callbacks ran once each in injection order."
          ansible.builtin.shell: |
            set -o pipefail
            tail -c +{{ (callback_log.stat.size | int) + 1 }} -- {{ nisd_log_file | quote }} |
              sed -nE '/ncp_event_test_cb: dispatched TEST event/s/.*"marker"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p'
          args:
            executable: /bin/bash
          register: callbacks
          changed_when: false
          until: callbacks.rc == 0 and callbacks.stdout_lines == event_markers
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"

        - name: "{{ recipe_name }}: Validate the recorded PID before stopping NISD."
          ansible.builtin.assert:
            that: first_nisd_pid | int > 1

        - name: "{{ recipe_name }}: Stop the first NISD."
          ansible.builtin.command:
            argv: [kill, "-TERM", "{{ first_nisd_pid }}"]

        - name: "{{ recipe_name }}: Wait for the first process to exit."
          ansible.builtin.wait_for:
            path: "/proc/{{ first_nisd_pid }}"
            state: absent
            timeout: 30

        - name: "{{ recipe_name }}: Archive the first launch log before restarting."
          ansible.builtin.command:
            argv: [mv, "--", "{{ nisd_log_file }}", "{{ nisd_log_file }}.before-restart"]

        - name: "{{ recipe_name }}: Restart NISD using same backing device."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
              enable_cp_event_handler: 1
              nisd_secret: "{{ nisd_secret }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup(
                  'nisd_handler',
                  'run_nisd',
                  input_param
                )
              }}

        # ------------------------------------------------------------
        # 10. Wait for event sector read / async handler initialization
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Wait for ping_enabled after restart."
          vars:
            stage: "wait_for_ping_after_restart"
          ansible.builtin.debug:
            msg: "Waiting for async-event sector initialization after restart"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup(
                'niova_ctlrequest',
                'lookup',
                nisd_uuid,
                ncp_event_ping_key,
                'nisd',
                lookout_uuid
              )['/ncp_event/ping_enabled']
              | string
              | lower
            ) in ['1', 'true']

        # ------------------------------------------------------------
        # 11. Verify event_sno is restored to 3
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Read event_sno after restart."
          vars:
            stage: "event_sno_after_restart"
            after_restart_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            event_sno_after_restart: "{{ after_restart_state['/ncp_event/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify event progress persisted."
          ansible.builtin.assert:
            that:
              - event_sno_after_restart | int == 3
            fail_msg: >-
              NISD did not restore event progress. Expected 3, got
              {{ event_sno_after_restart }}.
            success_msg: "event_sno=3 restored from on-device event sector."

        - name: "{{ recipe_name }}: Queue a fresh TEST event for the restarted NISD."
          ansible.builtin.set_fact:
            fresh_event: >-
              {{ lookup('tidb_api', 'add_event', base_url=api_base_url,
                        token=login_result.access_token,
                        body={'nisd_id': nisd_uuid, 'action': async_event_action,
                              'params': {'marker': 'after-restart'}}) }}

        - name: "{{ recipe_name }}: Verify the fresh event follows the restored serial."
          ansible.builtin.assert:
            that:
              - fresh_event.data.status == 0
              - fresh_event.data.payload.nisd_id == nisd_uuid
              - fresh_event.data.payload.action == async_event_action
              - fresh_event.data.payload.event_ptr == (event_sno_after_restart | int) + 1

        - name: "{{ recipe_name }}: Wait for the restarted NISD to dispatch the fresh event."
          vars:
            stage: "wait_for_post_restart_event"
          ansible.builtin.debug:
            msg: "Waiting for event serial {{ fresh_event.data.payload.event_ptr }}"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (lookup('niova_ctlrequest','lookup',nisd_uuid,ncp_event_sno_key,'nisd',lookout_uuid)[ncp_event_sno_key] | int)
            == fresh_event.data.payload.event_ptr

        - name: "{{ recipe_name }}: Check that only the fresh TEST callback ran after restart."
          ansible.builtin.command:
            argv:
              - sed
              - -nE
              - '/ncp_event_test_cb: dispatched TEST event/s/.*"marker"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p'
              - "{{ nisd_log_file }}"
          register: restarted_callbacks
          changed_when: false
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: restarted_callbacks.rc == 0 and restarted_callbacks.stdout_lines == ['after-restart']

        - name: "{{ recipe_name }}: Wait for the CP to mark the injected event acknowledged."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/api/events?nisd_id={{ nisd_uuid }}&action={{ async_event_action }}"
            headers:
              Authorization: "Bearer {{ login_result.access_token }}"
            status_code: 200
          register: ack_response
          vars:
            payload: "{{ ack_response.json.payload | default([]) }}"
            rows: "{{ payload.events | default(payload.rows | default([])) if payload is mapping else payload }}"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            ack_response.status == 200 and
            ack_response.json.status | default(-1) == 0 and
            (rows | selectattr('nisd_id', 'equalto', nisd_uuid)
                  | selectattr('event_ptr', 'equalto', fresh_event.data.payload.event_ptr)
                  | selectattr('expire_at', 'defined') | selectattr('expire_at')
                  | list | length) == 1
          no_log: true

      rescue:
        - name: "Recipe: {{ recipe_name }} failed"
          ansible.builtin.set_fact:
            terminate_recipe: true

      always:
        # Holon post_run handles the recorded NISD and its backing file.
        - name: "{{ recipe_name }}: Tear down mdsvc-tidb."
          ansible.builtin.debug:
            msg: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          ignore_errors: true
