- name: "tidb_snapshot_setup.yml"
  hosts: localhost
  connection: local

  vars:
    snapshot_api_base_url: "http://localhost:8081"

    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    vdev_payload: "{{ playbook_dir }}/../examples/create_sample_vdev.json"

    snapshot_nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"

    snapshot_cp_username: "admin"
    snapshot_cp_password: "admin"

    niova_block_repo: >-
      {{
        lookup('env', 'NIOVA_BLOCK_REPO')
        | default(playbook_dir ~ '/../..', true)
      }}

  tasks:
    - name: "snapshot_setup: Check application type."
      ansible.builtin.assert:
        that:
          - app_type == "tidb"
        fail_msg: "Snapshot recipes must run with app_type=tidb."

    # ------------------------------------------------------------
    # Start mdsvc-tidb
    # ------------------------------------------------------------
    - name: "snapshot_setup: Start mdsvc-tidb."
      ansible.builtin.set_fact:
        setup_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

    - name: "snapshot_setup: Wait for mdsvc-api."
      ansible.builtin.uri:
        url: "{{ snapshot_api_base_url }}/swagger/"
        method: GET
        status_code: [200, 301, 302]
      register: api_health
      retries: 90
      delay: 2
      until: api_health.status in [200, 301, 302]

    # ------------------------------------------------------------
    # Login
    # ------------------------------------------------------------
    - name: "snapshot_setup: Login to mdsvc-api."
      ansible.builtin.set_fact:
        snapshot_login_result: >-
          {{
            lookup(
              'tidb_api',
              'login',
              base_url=snapshot_api_base_url,
              username=snapshot_cp_username,
              password=snapshot_cp_password
            )
          }}

    - name: "snapshot_setup: Verify access token."
      ansible.builtin.assert:
        that:
          - snapshot_login_result.access_token is defined
          - snapshot_login_result.access_token | length > 0

    # ------------------------------------------------------------
    # Create infrastructure
    # ------------------------------------------------------------
    - name: "snapshot_setup: Create infra."
      ansible.builtin.set_fact:
        infra_result: >-
          {{
            lookup(
              'tidb_api',
              'create_infra',
              base_url=snapshot_api_base_url,
              token=snapshot_login_result.access_token,
              file=infra_payload
            )
          }}

    # ------------------------------------------------------------
    # Create backing device
    # ------------------------------------------------------------
    - name: "snapshot_setup: Create NISD device file."
      vars:
        img_dir: "/snapshot-test.device"
        bs: "64M"
        count: 160
      ansible.builtin.debug:
        msg:
          - "{{ lookup('helper', 'create_dd_file', img_dir, bs, count) }}"
      register: nisd_dev_path

    - name: "snapshot_setup: Store NISD device path."
      ansible.builtin.set_fact:
        snapshot_nisd_device_path: "{{ nisd_dev_path.msg[0] }}"

    - name: "snapshot_setup: Verify NISD backing device."
      ansible.builtin.stat:
        path: "{{ snapshot_nisd_device_path }}"
      register: nisd_device_stat

    - name: "snapshot_setup: Assert NISD backing device exists."
      ansible.builtin.assert:
        that:
          - nisd_device_stat.stat.exists

    # ------------------------------------------------------------
    # Initialise NISD
    # ------------------------------------------------------------
    - name: "snapshot_setup: Initialize NISD."
      vars:
        input_param:
          nisd_device_path: "{{ snapshot_nisd_device_path }}"
          nisd_uuid: "{{ snapshot_nisd_uuid }}"
      ansible.builtin.debug:
        msg: >-
          {{ lookup(
               'nisd_handler',
               'run-niova-block-ctl',
               input_param
             ) }}

    # ------------------------------------------------------------
    # Start NISD
    # ------------------------------------------------------------
    - name: "snapshot_setup: Start NISD."
      vars:
        input_param:
          nisd_device_path: "{{ snapshot_nisd_device_path }}"
          nisd_uuid: "{{ snapshot_nisd_uuid }}"
          peer_port: "13000"
          client_port: "13001"
          enable_auth: 1
      ansible.builtin.debug:
        msg:
          - "{{ lookup('nisd_handler', 'run_nisd', input_param) }}"

    # ------------------------------------------------------------
    # Create VDEV
    # ------------------------------------------------------------
    - name: "snapshot_setup: Create vdev."
      ansible.builtin.set_fact:
        snapshot_vdev_result: >-
          {{
            lookup(
              'tidb_api',
              'create_vdev',
              base_url=snapshot_api_base_url,
              token=snapshot_login_result.access_token,
              file=vdev_payload
            )
          }}

    - name: "snapshot_setup: Store vdev UUID."
      ansible.builtin.set_fact:
        snapshot_vdev_uuid: >-
          {{
            snapshot_vdev_result.vdev_id
            | default(snapshot_vdev_result.uuid)
          }}

    - name: "snapshot_setup: Verify vdev UUID."
      ansible.builtin.assert:
        that:
          - snapshot_vdev_uuid is defined
          - snapshot_vdev_uuid | length > 0

    # ------------------------------------------------------------
    # Start live niova-ublk
    # ------------------------------------------------------------
    - name: "snapshot_setup: Record existing ublk devices."
      ansible.builtin.shell: |
        shopt -s nullglob
        for dev in /dev/ublkb*; do
            printf '%s\n' "$dev"
        done
      args:
        executable: /bin/bash
      register: ublk_before
      changed_when: false

    - name: "snapshot_setup: Start live RW niova-ublk."
      vars:
        input_param:
          cp_mode: 1
          enable_auth: 1
          nisd_uuid: "{{ snapshot_nisd_uuid }}"
          vdev_uuid: "{{ snapshot_vdev_uuid }}"
          user_name: "{{ snapshot_cp_username }}"
          user_secret: "{{ snapshot_cp_password }}"
      ansible.builtin.set_fact:
        live_ublk_uuid: >-
          {{ lookup(
               'nisd_handler',
               'run_ublk_device',
               input_param
             ) }}

    - name: "snapshot_setup: Wait for live ublk device."
      ansible.builtin.shell: |
        shopt -s nullglob
        for dev in /dev/ublkb*; do
            printf '%s\n' "$dev"
        done
      args:
        executable: /bin/bash
      register: ublk_after
      changed_when: false
      retries: 40
      delay: 1
      until: >-
        (
          ublk_after.stdout_lines
          | difference(ublk_before.stdout_lines)
          | length
        ) >= 1

    - name: "snapshot_setup: Store newly created ublk devices."
      ansible.builtin.set_fact:
        live_ublk_devices: >-
          {{
            ublk_after.stdout_lines
            | difference(ublk_before.stdout_lines)
          }}

    - name: "snapshot_setup: Verify exactly one device."
      ansible.builtin.assert:
        that:
          - live_ublk_devices | length == 1
        fail_msg: >-
          Expected exactly one new live ublk device,
          found {{ live_ublk_devices | length }}:
          {{ live_ublk_devices }}

    - name: "snapshot_setup: Store live device."
      ansible.builtin.set_fact:
        snapshot_live_device: "{{ live_ublk_devices[0] }}"

    - name: "snapshot_setup: Verify live device."
      ansible.builtin.stat:
        path: "{{ snapshot_live_device }}"
      register: live_device_stat

    - name: "snapshot_setup: Assert live block device is ready."
      ansible.builtin.assert:
        that:
          - live_device_stat.stat.exists
          - live_device_stat.stat.isblk | default(false)