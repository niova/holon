- name: "tidb_nisd_async_event_multiple_order.yml"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    recipe_name: "tidb_nisd_async_event_multiple_order"
    api_base_url: "http://localhost:8081"
    cp_username: "admin"
    cp_password: "admin"
    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    nisd_device_path: "/nisd-async-event-multiple-order.device"
    nisd_device_size: "10G"
    nisd_peer_port: "13000"
    nisd_client_port: "13001"
    nisd_secret: >-
      {{
        lookup('env', 'NIOVA_NISD_SECRET')
        | default('Nisd-secret', true)
      }}
    lookout_uuid: ""
    ncp_event_ping_key: "/ncp_event/0/ping_enabled"
    ncp_event_sno_key: "/ncp_event/0/event_sno"
    async_event_action: 250
    async_event_add_path: "/api/test/event"
    async_event_timeout_retries: 60
    async_event_poll_delay: 1
    event_markers:
      - "event-1"
      - "event-2"
      - "event-3"
      - "event-4"

  tasks:
    - block:
        - name: "{{ recipe_name }}: Check application type."
          ansible.builtin.assert:
            that:
              - app_type == "tidb"
            fail_msg: "This recipe must run with app_type=tidb."

        - name: "{{ recipe_name }}: Start mdsvc-tidb."
          ansible.builtin.set_fact:
            setup_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

        - name: "{{ recipe_name }}: Wait for Control Plane."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code: [200, 301, 302]
            timeout: 10
          register: api_health
          retries: 90
          delay: 2
          until: api_health.status in [200, 301, 302]

        - name: "{{ recipe_name }}: Login to Control Plane."
          ansible.builtin.set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username=cp_username,
                  password=cp_password
                )
              }}

        - name: "{{ recipe_name }}: Create infrastructure."
          ansible.builtin.set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=infra_payload
                )
              }}

        - name: "{{ recipe_name }}: Create fresh NISD backing file."
          ansible.builtin.command:
            argv:
              - truncate
              - -s
              - "{{ nisd_device_size }}"
              - "{{ nisd_device_path }}"
          changed_when: true

        - name: "{{ recipe_name }}: Initialize NISD backing storage."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup(
                  'nisd_handler',
                  'run-niova-block-ctl',
                  input_param
                )
              }}

        - name: "{{ recipe_name }}: Start NISD with async-event handler."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_device_path }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
              enable_cp_event_handler: 1
              nisd_secret: "{{ nisd_secret }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup(
                  'nisd_handler',
                  'run_nisd',
                  input_param
                )
              }}

        - name: "{{ recipe_name }}: Wait for NISD process."
          ansible.builtin.shell: "pgrep -x nisd"
          args:
            executable: /bin/bash
          register: nisd_process
          changed_when: false
          retries: 30
          delay: 1
          until: nisd_process.rc == 0

        - name: "{{ recipe_name }}: Wait for async-event ping to become enabled."
          vars:
            stage: "wait_for_async_event_ping"
          ansible.builtin.debug:
            msg: "Waiting for ncp_event ping_enabled=true"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup(
                'niova_ctlrequest',
                'lookup',
                nisd_uuid,
                ncp_event_ping_key,
                'nisd',
                lookout_uuid
              )['/0/ping_enabled']
              | string
              | lower
            ) in ['1', 'true']

        - name: "{{ recipe_name }}: Read initial event_sno."
          vars:
            stage: "get_initial_event_sno"
            event_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            initial_event_sno: "{{ event_state['/0/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify initial event_sno."
          ansible.builtin.assert:
            that:
              - initial_event_sno | int == 0
            fail_msg: >-
              Expected fresh NISD event_sno=0, but got
              event_sno={{ initial_event_sno }}.
            success_msg: "Initial event_sno=0."

        - name: "{{ recipe_name }}: Set expected final event serial."
          ansible.builtin.set_fact:
            expected_final_event_sno: "{{ (initial_event_sno | int) + 4 }}"

        - name: "{{ recipe_name }}: Add four TEST async events."
          ansible.builtin.set_fact:
            add_event_results: >-
              {{
                add_event_results | default([]) +
                [
                  lookup(
                    'tidb_api',
                    'custom_request',
                    async_event_add_path,
                    method='POST',
                    base_url=api_base_url,
                    token=login_result.access_token,
                    body={
                      'EntityID': nisd_uuid,
                      'Action': async_event_action,
                      'Params': {
                        'marker': item
                      }
                    }
                  )
                ]
              }}
          loop: "{{ event_markers }}"
          loop_control:
            label: "{{ item }}"

        - name: "{{ recipe_name }}: Show AddEvent responses."
          ansible.builtin.debug:
            var: add_event_results

        - name: "{{ recipe_name }}: Wait until final event_sno is reached."
          vars:
            stage: "wait_for_final_event_sno"
          ansible.builtin.debug:
            msg: "Waiting for event_sno={{ expected_final_event_sno }}"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup(
                'niova_ctlrequest',
                'lookup',
                nisd_uuid,
                ncp_event_sno_key,
                'nisd',
                lookout_uuid
              )['/0/event_sno']
              | int
            ) >= (expected_final_event_sno | int)

        - name: "{{ recipe_name }}: Read final event_sno."
          vars:
            stage: "get_final_event_sno"
            final_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            final_event_sno: "{{ final_state['/0/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify final durable event_sno."
          ansible.builtin.assert:
            that:
              - final_event_sno | int == expected_final_event_sno | int
            fail_msg: >-
              Expected final event_sno={{ expected_final_event_sno }},
              but got event_sno={{ final_event_sno }}.
            success_msg: >-
              Final event_sno reached {{ final_event_sno }}.

        - name: "{{ recipe_name }}: Resolve NISD log path."
          ansible.builtin.set_fact:
            nisd_log_file: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/nisd_{{ nisd_uuid }}.log

        - name: "{{ recipe_name }}: Wait for all four callback markers."
          ansible.builtin.shell: |
            set -o pipefail
            grep -q "event-1" "{{ nisd_log_file }}" &&
            grep -q "event-2" "{{ nisd_log_file }}" &&
            grep -q "event-3" "{{ nisd_log_file }}" &&
            grep -q "event-4" "{{ nisd_log_file }}"
          args:
            executable: /bin/bash
          register: callback_markers_present
          retries: 30
          delay: 1
          until: callback_markers_present.rc == 0
          changed_when: false

        - name: "{{ recipe_name }}: Read callback marker line numbers."
          ansible.builtin.shell: |
            set -o pipefail
            event1=$(grep -n -m1 "event-1" "{{ nisd_log_file }}" | cut -d: -f1)
            event2=$(grep -n -m1 "event-2" "{{ nisd_log_file }}" | cut -d: -f1)
            event3=$(grep -n -m1 "event-3" "{{ nisd_log_file }}" | cut -d: -f1)
            event4=$(grep -n -m1 "event-4" "{{ nisd_log_file }}" | cut -d: -f1)

            printf '%s %s %s %s\n' "$event1" "$event2" "$event3" "$event4"
          args:
            executable: /bin/bash
          register: callback_order_lines
          changed_when: false

        - name: "{{ recipe_name }}: Parse callback line numbers."
          ansible.builtin.set_fact:
            callback_line_numbers: "{{ callback_order_lines.stdout.split() | map('int') | list }}"

        - name: "{{ recipe_name }}: Verify callbacks were processed in order."
          ansible.builtin.assert:
            that:
              - callback_line_numbers | length == 4
              - callback_line_numbers[0] < callback_line_numbers[1]
              - callback_line_numbers[1] < callback_line_numbers[2]
              - callback_line_numbers[2] < callback_line_numbers[3]
            fail_msg: >-
              Events were not observed in the expected callback order.
              Expected event-1 -> event-2 -> event-3 -> event-4.
              Callback line numbers={{ callback_line_numbers }}.
            success_msg: >-
              Callback order verified:
              event-1 -> event-2 -> event-3 -> event-4.

        - name: "{{ recipe_name }}: Test passed."
          ansible.builtin.debug:
            msg:
              - "Multiple async-event ordering test passed."
              - "Initial event_sno={{ initial_event_sno }}"
              - "Final event_sno={{ final_event_sno }}"
              - "Callbacks processed in order: event-1 -> event-2 -> event-3 -> event-4"
              - "No intermediate event_sno values were required."

      always:
        - name: "{{ recipe_name }}: Remove test backing file."
          ansible.builtin.file:
            path: "{{ nisd_device_path }}"
            state: absent
          ignore_errors: true

        - name: "{{ recipe_name }}: Tear down mdsvc-tidb."
          ansible.builtin.debug:
            msg: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          ignore_errors: true
