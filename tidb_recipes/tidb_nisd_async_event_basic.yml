- name: "tidb_nisd_async_event_basic.yml"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    recipe_name: "tidb_nisd_async_event_basic"
    api_base_url: "http://localhost:8081"
    cp_username: "admin"
    cp_password: "admin"
    infra_payload: "{{ playbook_dir }}/../examples/create_sample_infra.json"
    nisd_uuid: "1a93c9af-5184-49b4-972b-1c94a2057e74"
    run_dir: "{{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}"
    nisd_log_file: "{{ run_dir }}/nisd_{{ nisd_uuid }}.log"
    nisd_peer_port: "{{ ClusterParams.srv_port }}"
    nisd_client_port: "{{ ClusterParams.client_port }}"
    nisd_secret: >-
      {{
        lookup('env', 'NIOVA_NISD_SECRET')
        | default('Nisd-secret', true)
      }}
    lookout_uuid: ""
    # ncp_event lreg keys exposed by the NISD ctl interface.
    ncp_event_ping_key: "/ncp_event/ping_enabled"
    ncp_event_sno_key: "/ncp_event/event_sno"
    # TEST event type used by the async-event implementation.
    async_event_action: 250
    async_event_timeout_retries: 45
    async_event_poll_delay: 1

  tasks:
    - block:
        # ------------------------------------------------------------
        # 1. Start Control Plane
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Check application type."
          ansible.builtin.assert:
            that:
              - app_type == "tidb"
            fail_msg: "This recipe must run with app_type=tidb."

        - name: "{{ recipe_name }}: Start mdsvc-tidb."
          ansible.builtin.set_fact:
            setup_status: "{{ lookup('tidb_setup', 'docker_setup') }}"

        - name: "{{ recipe_name }}: Wait for Control Plane."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/swagger/"
            method: GET
            status_code:
              - 200
              - 301
              - 302
            timeout: 10
          register: api_health
          retries: 90
          delay: 2
          until: api_health.status in [200, 301, 302]

        # ------------------------------------------------------------
        # 2. Login and create infrastructure
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Login to Control Plane."
          ansible.builtin.set_fact:
            login_result: >-
              {{
                lookup(
                  'tidb_api',
                  'login',
                  base_url=api_base_url,
                  username=cp_username,
                  password=cp_password
                )
              }}

        - name: "{{ recipe_name }}: Create infrastructure."
          ansible.builtin.set_fact:
            infra_result: >-
              {{
                lookup(
                  'tidb_api',
                  'create_infra',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  file=infra_payload
                )
              }}

        # ------------------------------------------------------------
        # 3. Prepare and format NISD backing storage
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Create NISD device file."
          vars:
            img_dir: "/nisd-async-event-basic.device"
            bs: "64M"
            count: 160
          debug:
            msg:
              - "{{ lookup('helper', 'create_dd_file', img_dir, bs, count) }}"
          register: nisd_dev_path

        - name: "{{ recipe_name }}: Print NISD device path."
          debug:
            msg: "{{ nisd_dev_path.msg[0] }}"

        - name: "{{ recipe_name }}: Initialize NISD using niova-block-ctl."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_dev_path.msg[0] }}"
              nisd_uuid: "{{ nisd_uuid }}"
          debug:
            msg: "{{ lookup('nisd_handler', 'run-niova-block-ctl', input_param) }}"

        # ------------------------------------------------------------
        # 4. Start NISD with async-event handling enabled
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Mark the NISD start attempt."
          ansible.builtin.set_fact:
            nisd_start_attempted: true

        - name: "{{ recipe_name }}: Start NISD with async-event handler."
          vars:
            input_param:
              nisd_device_path: "{{ nisd_dev_path.msg[0] }}"
              nisd_uuid: "{{ nisd_uuid }}"
              peer_port: "{{ nisd_peer_port }}"
              client_port: "{{ nisd_client_port }}"
              enable_auth: 1
              enable_cp_event_handler: 1
              nisd_secret: "{{ nisd_secret }}"
          ansible.builtin.debug:
            msg: >-
              {{
                lookup('nisd_handler','run_nisd',input_param)
              }}

        - name: "{{ recipe_name }}: Read the PID recorded by run_nisd."
          ansible.builtin.set_fact:
            recipe_nisd_pid: "{{ (lookup('file', run_dir ~ '/' ~ ClusterParams.raft_uuid ~ '.json') | from_json).nisd_process.process_pid }}"

        - name: "{{ recipe_name }}: Wait for NISD registration."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/api/resource?type=nisd"
            method: GET
            headers:
              Authorization: "Bearer {{ login_result.access_token }}"
            status_code: 200
            return_content: true
          register: nisd_resources
          retries: 30
          delay: 2
          until: >-
            nisd_uuid in (nisd_resources.content | default(''))
          no_log: true

        # ------------------------------------------------------------
        # 5. Verify ping_enabled = true
        # ------------------------------------------------------------

        # The existing niova_ctlrequest lookup interface is:
        # lookup('niova_ctlrequest','lookup',nisd_uuid,lookup_key,'nisd',lookout_uuid)

        - name: "{{ recipe_name }}: Wait for async-event ping to become enabled."
          vars:
            stage: "wait_for_async_event_ping"
            ping_state: >-
              {{
                lookup('niova_ctlrequest','lookup', nisd_uuid, ncp_event_ping_key, 'nisd', lookout_uuid)
              }}
          ansible.builtin.debug:
            msg: "ncp_event ping state: {{ ping_state }}"
          register: ping_enabled_result
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup('niova_ctlrequest','lookup',nisd_uuid,ncp_event_ping_key,'nisd',lookout_uuid)['/ncp_event/ping_enabled']
              | string | lower
            ) in ['1', 'true']

        # ------------------------------------------------------------
        # 6. Read initial event_sno
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Read initial event_sno."
          vars:
            stage: "get_initial_event_sno"
            event_state: >-
              {{
                lookup('niova_ctlrequest','lookup',nisd_uuid,ncp_event_sno_key,'nisd',lookout_uuid)
              }}
          ansible.builtin.set_fact:
            initial_event_sno: "{{ event_state['/ncp_event/event_sno'] | int }}"

        # ------------------------------------------------------------
        # 7. Add one TEST event to the Control Plane
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Record the callback log boundary before injection."
          ansible.builtin.stat:
            path: "{{ nisd_log_file }}"
            get_checksum: false
          register: callback_log_before

        - name: "{{ recipe_name }}: Add one TEST async event."
          ansible.builtin.set_fact:
            add_event_result: >-
              {{
                lookup(
                  'tidb_api',
                  'add_event',
                  base_url=api_base_url,
                  token=login_result.access_token,
                  body={
                    'nisd_id': nisd_uuid,
                    'action': async_event_action,
                    'params': {
                      'test': 'basic-async-event'
                    }
                  }
                )
              }}

        - name: "{{ recipe_name }}: Validate the event accepted by the control plane."
          vars:
            response: "{{ add_event_result.data }}"
          ansible.builtin.assert:
            that:
              - response.status == 0
              - response.payload.nisd_id == nisd_uuid
              - response.payload.action == async_event_action
              - response.payload.event_ptr is integer
              - response.payload.event_ptr > (initial_event_sno | int)
            fail_msg: "Unexpected AddEvent result {{ add_event_result }}"

        - name: "{{ recipe_name }}: Track the serial assigned by the control plane."
          ansible.builtin.set_fact:
            expected_event_sno: "{{ add_event_result.data.payload.event_ptr }}"

        # ------------------------------------------------------------
        # 8. Poll until event_sno advances
        # ------------------------------------------------------------

        # The heartbeat runs automatically in NISD. Do not sleep for an
        # exact heartbeat boundary; poll the durable event serial instead.
        - name: "{{ recipe_name }}: Wait until NISD processes the event."
          vars:
            stage: "wait_for_event_sno"
          ansible.builtin.debug:
            msg: "Waiting for event_sno={{ expected_event_sno }}"
          register: event_wait_result
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            (
              lookup('niova_ctlrequest','lookup',nisd_uuid,ncp_event_sno_key,'nisd',lookout_uuid)['/ncp_event/event_sno']
              | int
            ) >= (expected_event_sno | int)

        # ------------------------------------------------------------
        # 9. Read and verify final event_sno
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Read final event_sno."
          vars:
            stage: "get_final_event_sno"
            final_event_state: >-
              {{
                lookup(
                  'niova_ctlrequest',
                  'lookup',
                  nisd_uuid,
                  ncp_event_sno_key,
                  'nisd',
                  lookout_uuid
                )
              }}
          ansible.builtin.set_fact:
            final_event_sno: "{{ final_event_state['/ncp_event/event_sno'] | int }}"

        - name: "{{ recipe_name }}: Verify event_sno reached the injected event."
          ansible.builtin.assert:
            that:
              - final_event_sno | int == expected_event_sno | int
            fail_msg: >-
              Expected event_sno={{ expected_event_sno }},
              but NISD reported event_sno={{ final_event_sno }}.
            success_msg: >-
              NISD processed the event and advanced event_sno from
              {{ initial_event_sno }} to {{ final_event_sno }}.

        # ------------------------------------------------------------
        # 10. Verify the TEST event callback executed
        # ------------------------------------------------------------

        - name: "{{ recipe_name }}: Find a new TEST callback in the NISD log."
          ansible.builtin.shell: |
            set -o pipefail
            tail -c +{{ (callback_log_before.stat.size | default(0) | int) + 1 }} -- {{ nisd_log_file | quote }} |
              grep -F ncp_event_test
          args:
            executable: /bin/bash
          register: callback_result
          retries: 15
          delay: 1
          until: callback_result.rc == 0
          changed_when: false

        - name: "{{ recipe_name }}: Wait for the CP to mark the injected event acknowledged."
          ansible.builtin.uri:
            url: "{{ api_base_url }}/api/events?nisd_id={{ nisd_uuid }}&action={{ async_event_action }}"
            headers:
              Authorization: "Bearer {{ login_result.access_token }}"
            status_code: 200
          register: ack_response
          vars:
            payload: "{{ ack_response.json.payload | default([]) }}"
            rows: "{{ payload.events | default(payload.rows | default([])) if payload is mapping else payload }}"
          retries: "{{ async_event_timeout_retries }}"
          delay: "{{ async_event_poll_delay }}"
          until: >-
            ack_response.status == 200 and
            ack_response.json.status | default(-1) == 0 and
            (rows | selectattr('nisd_id', 'equalto', nisd_uuid)
                  | selectattr('event_ptr', 'equalto', expected_event_sno | int)
                  | selectattr('expire_at', 'defined') | selectattr('expire_at')
                  | list | length) == 1
          no_log: true

      rescue:
        - name: "Recipe: {{ recipe_name }} failed"
          ansible.builtin.set_fact:
            terminate_recipe: true

      always:
        # Stop the NISD before deleting its backing file. This prevents failed
        # runs from leaving the process alive on ports 13000/13001.
        - name: "{{ recipe_name }}: Stop NISD if it is still running."
          ansible.builtin.shell: |
            set -euo pipefail

            pid={{ recipe_nisd_pid | int }}
            [[ "$pid" -gt 1 ]] || exit 1
            owns_nisd() {
              [[ -r /proc/$pid/comm && $(cat "/proc/$pid/comm") == nisd ]] &&
                grep -Fzxq -- {{ nisd_dev_path.msg[0] | quote }} "/proc/$pid/cmdline"
            }
            [[ -d /proc/$pid ]] || exit 0
            owns_nisd || exit 1
            kill -TERM "$pid"
            for ((i=0; i<10; i++)); do
              owns_nisd || exit 0
              sleep 1
            done
            if owns_nisd; then kill -KILL "$pid"; fi
          args:
            executable: /bin/bash
          changed_when: false
          when: recipe_nisd_pid is defined
          register: stop_nisd
          failed_when: false

        - name: "{{ recipe_name }}: Remove NISD backing file."
          ansible.builtin.file:
            path: "{{ nisd_dev_path.msg[0] }}"
            state: absent
          when:
            - nisd_start_attempted is not defined or stop_nisd.rc | default(1) == 0
            - nisd_dev_path is defined
            - nisd_dev_path.msg is defined
            - nisd_dev_path.msg | length > 0

        - name: "{{ recipe_name }}: Tear down mdsvc-tidb."
          ansible.builtin.debug:
            msg: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          ignore_errors: true


        - name: "{{ recipe_name }}: Report incomplete process cleanup."
          ansible.builtin.set_fact:
            terminate_recipe: true
          when: nisd_start_attempted is defined and stop_nisd.rc | default(1) != 0
