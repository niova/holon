---
# Common snapshot test environment:
#   - mdsvc-tidb
#   - CP login
#   - infrastructure
#   - NISD
#   - VDEV
#   - live RW niova-ublk device
- import_playbook: tidb_snapshot_setup.yml

- name: "tidb_snapshot_basic_point_in_time.yml"
  hosts: localhost
  connection: local

  vars:
    recipe_name: "tidb_snapshot_basic_point_in_time"

    api_base_url: "http://localhost:8081"

    cp_username: "admin"
    cp_password: "admin"

    niova_block_repo: >-
      {{
        lookup('env', 'NIOVA_BLOCK_REPO')
        | default(playbook_dir ~ '/../..', true)
      }}

    snapshot_test_script: >-
      {{ niova_block_repo }}/test/system-tests/snapshot-basic-point-in-time.sh

    niova_snapshot_bin: "{{ niova_block_repo }}/scripts/niova-snapshot"

    niova_ublk_bin: >-
      {{
        (lookup('env', 'NIOVA_BIN_PATH') ~ '/bin/niova-ublk')
        if lookup('env', 'NIOVA_BIN_PATH')
        else 'niova-ublk'
      }}

    gossip_path: >-
      {{ lookup('env', 'NIOVA_WORKSPACE') }}/mdsvc-tidb/configs/gossipNodes

  tasks:
    - block:

        # ------------------------------------------------------------
        # 1. Prepare point-in-time snapshot test
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Generate unique snapshot name."
          ansible.builtin.set_fact:
            snapshot_name: "snapshot-basic-{{ lookup('pipe', 'date +%s%N') }}"

        - name: "{{ recipe_name }}: Build test log directory path."
          ansible.builtin.set_fact:
            snapshot_test_logdir: >-
              {{ ClusterParams.base_dir }}/{{ ClusterParams.raft_uuid }}/snapshot-basic-point-in-time

        - name: "{{ recipe_name }}: Verify snapshot test script exists."
          ansible.builtin.stat:
            path: "{{ snapshot_test_script }}"
          register: snapshot_script_stat

        - name: "{{ recipe_name }}: Assert snapshot test script exists."
          ansible.builtin.assert:
            that:
              - snapshot_script_stat.stat.exists
            fail_msg: >-
              Snapshot test script not found:
              {{ snapshot_test_script }}

        - name: "{{ recipe_name }}: Verify niova-snapshot exists."
          ansible.builtin.stat:
            path: "{{ niova_snapshot_bin }}"
          register: snapshot_cli_stat

        - name: "{{ recipe_name }}: Assert niova-snapshot exists."
          ansible.builtin.assert:
            that:
              - snapshot_cli_stat.stat.exists
            fail_msg: >-
              niova-snapshot not found:
              {{ niova_snapshot_bin }}

        # ------------------------------------------------------------
        # 2. Verify common snapshot setup results
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Verify snapshot setup."
          ansible.builtin.assert:
            that:
              - snapshot_login_result is defined
              - snapshot_login_result.access_token is defined
              - snapshot_login_result.access_token | length > 0

              - snapshot_vdev_uuid is defined
              - snapshot_vdev_uuid | length > 0

              - snapshot_live_device is defined
              - snapshot_live_device | length > 0
            fail_msg: >-
              Snapshot test setup did not provide all required values.

        - name: "{{ recipe_name }}: Verify live block device."
          ansible.builtin.stat:
            path: "{{ snapshot_live_device }}"
          register: live_device_stat

        - name: "{{ recipe_name }}: Assert live block device is ready."
          ansible.builtin.assert:
            that:
              - live_device_stat.stat.exists
              - live_device_stat.stat.isblk | default(false)
            fail_msg: >-
              Live ublk device is not ready:
              {{ snapshot_live_device }}

        # ------------------------------------------------------------
        # 3. Run point-in-time snapshot data-path test
        #
        # The shell test verifies:
        #   - A write succeeds and CRC32C verifies
        #   - exact pre-snapshot region hash is recorded
        #   - snapshot create succeeds
        #   - CP reaches state=applied
        #   - B overwrites the same VBLKs and CRC32C verifies
        #   - A hash != B hash
        #   - live view hash == B
        #   - RO snapshot mount is created
        #   - snapshot CRC32C verification succeeds against A
        #   - snapshot hash == A and != B
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Run basic point-in-time snapshot test."
          ansible.builtin.shell: |
            set -o pipefail
            bash "{{ snapshot_test_script }}"
          args:
            executable: /bin/bash
          environment:
            VDEV_UUID: "{{ snapshot_vdev_uuid }}"
            LIVE_DEVICE: "{{ snapshot_live_device }}"
            SNAPSHOT_NAME: "{{ snapshot_name }}"

            NIOVA_SNAPSHOT: "{{ niova_snapshot_bin }}"
            NIOVA_UBLK: "{{ niova_ublk_bin }}"

            MDSVC_API_URL: "{{ api_base_url }}"

            INTEGRATION_ADMIN_USERNAME: "{{ cp_username }}"
            INTEGRATION_ADMIN_PASSWORD: "{{ cp_password }}"

            TEST_LOGDIR: "{{ snapshot_test_logdir }}"
            DELETE_SNAPSHOT_ON_SUCCESS: "0"

            # Environment required by the RO snapshot niova-ublk
            # launched by the shell test.
            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"
            NIOVA_BLOCK_UBLK_UNIFIED: "0"

          register: snapshot_test_result

        - name: "{{ recipe_name }}: Print snapshot test output."
          ansible.builtin.debug:
            var: snapshot_test_result.stdout_lines

        - name: "{{ recipe_name }}: Assert shell test succeeded."
          ansible.builtin.assert:
            that:
              - snapshot_test_result.rc == 0
              - "'PASS: basic snapshot point-in-time test' in snapshot_test_result.stdout"
            fail_msg: >-
              Snapshot point-in-time test failed.
              Logs: {{ snapshot_test_logdir }}

        # ------------------------------------------------------------
        # 4. Independent CP verification through tidb_api lookup plugin
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Lookup snapshot through CP API."
          ansible.builtin.set_fact:
            snapshot_info: >-
              {{
                lookup(
                  'tidb_api',
                  'get_snapshot',
                  base_url=api_base_url,
                  token=snapshot_login_result.access_token,
                  params={
                    'vdev_id': snapshot_vdev_uuid,
                    'name': snapshot_name
                  }
                )
              }}

        - name: "{{ recipe_name }}: Verify CP snapshot state and ID."
          ansible.builtin.assert:
            that:
              - snapshot_info.status_code | int == 200
              - snapshot_info.state == "applied"
              - snapshot_info.snapshot_id is defined
              - snapshot_info.snapshot_id | int > 0
              - snapshot_info.vdev_id == snapshot_vdev_uuid
              - snapshot_info.name == snapshot_name
            fail_msg: >-
              CP snapshot validation failed.
              Snapshot response: {{ snapshot_info }}

        - name: "{{ recipe_name }}: Report successful verification."
          ansible.builtin.debug:
            msg:
              - "Snapshot basic point-in-time test PASSED"
              - "vdev={{ snapshot_vdev_uuid }}"
              - "snapshot={{ snapshot_name }}"
              - "snapshot_id={{ snapshot_info.snapshot_id }}"
              - "state={{ snapshot_info.state }}"
              - "live_device={{ snapshot_live_device }}"
              - "logs={{ snapshot_test_logdir }}"

      always:

        # ------------------------------------------------------------
        # Cleanup
        #
        # The shell script stops its own RO snapshot mount.
        # Keep cleanup best-effort so a failed assertion does not hide
        # the original test failure.
        # ------------------------------------------------------------
        - name: "{{ recipe_name }}: Delete test snapshot if it exists."
          ansible.builtin.command:
            argv:
              - "{{ niova_snapshot_bin }}"
              - "--vdev"
              - "{{ snapshot_vdev_uuid | default('') }}"
              - "--op"
              - "delete"
              - "--snapshot-name"
              - "{{ snapshot_name | default('') }}"
          environment:
            NIOVA_GOSSIP_PATH: "{{ gossip_path }}"
            NIOVA_GOSSIP_KEY: "dummy"

            NIOVA_BLOCK_CP_AUTH_USERNAME: "{{ cp_username }}"
            NIOVA_BLOCK_CP_AUTH_SECRET: "{{ cp_password }}"

            NIOVA_BLOCK_MDSVC_GET_CHUNKS_LIMIT: "256"
            NIOVA_BLOCK_PROXY_TAG: "mdsvc-tidb"

          register: snapshot_delete_result
          changed_when: snapshot_delete_result.rc == 0
          failed_when: false
          when:
            - snapshot_vdev_uuid is defined
            - snapshot_name is defined

        - name: "{{ recipe_name }}: Stop mdsvc-api and TiDB stack."
          ansible.builtin.set_fact:
            teardown_status: "{{ lookup('tidb_setup', 'docker_teardown') }}"
          failed_when: false